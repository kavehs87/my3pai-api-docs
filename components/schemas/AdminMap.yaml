type: object
properties:
  id:
    type: integer
  title:
    type: string
  slug:
    type: string
  creator:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      email:
        type: string
  status:
    type: string
    enum:
      - published
      - draft
  is_for_sale:
    type: boolean
  price_cents:
    type: integer
  purchases:
    type: integer
  revenue_cents:
    type: integer
  poi_count:
    type: integer
  thumbnail_url:
    type: string
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
