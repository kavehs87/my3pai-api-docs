type: object
properties:
  success:
    type: boolean
    example: true
  data:
    type: object
    properties:
      count:
        type: integer
        example: 5
      by_category:
        type: object
        description: Unread counts by category (business/system kept for backward-compat; new categories use data.category filter).
        properties:
          business:
            type: integer
            example: 3
          system:
            type: integer
            example: 2
      by_audience:
        type: object
        description: Unread counts by audience (D10) for reliable frontend filtering.
        properties:
          customer:
            type: integer
            example: 3
          creator:
            type: integer
            example: 1
          admin:
            type: integer
            example: 1
          transactional:
            type: integer
            example: 0
