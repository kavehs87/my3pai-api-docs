type: object
properties:
  id:
    type: integer
    example: 1
  name:
    type: string
    example: "John Doe"
  email:
    type: string
    format: email
    example: "john@example.com"
  subject:
    type: string
    enum: [general, course, business, press]
    example: "general"
  message:
    type: string
    example: "Hello, I have a question about your courses."
  is_read:
    type: boolean
    example: false
  read_at:
    type: string
    format: date-time
    nullable: true
    example: "2024-01-15T11:00:00.000000Z"
  influencer:
    type: object
    properties:
      id:
        type: integer
        example: 42
      name:
        type: string
        example: "Jane Smith"
      username:
        type: string
        example: "janesmith"
      email:
        type: string
        format: email
        example: "jane@example.com"
      avatar_url:
        type: string
        nullable: true
        example: "https://example.com/avatar.jpg"
      role:
        type: string
        example: "influencer"
      is_verified:
        type: boolean
        example: true
  created_at:
    type: string
    format: date-time
    example: "2024-01-15T10:30:00.000000Z"
  updated_at:
    type: string
    format: date-time
    example: "2024-01-15T10:30:00.000000Z"
