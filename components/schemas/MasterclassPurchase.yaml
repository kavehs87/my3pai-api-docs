type: object
properties:
  id:
    type: integer
  purchasedAt:
    type: string
    format: date-time
  purchasePrice:
    type: integer
    minimum: 0
    description: "Purchase price in cents"
    example: 4999
  masterclass:
    type: object
    nullable: true
    properties:
      id:
        type: integer
      title:
        type: string
      slug:
        type: string
      type:
        type: string
        enum: [course, guide, training, masterclass]
      coverImage:
        type: string
        nullable: true
        description: "Cover image URL"
      price_cents:
        type: integer
        description: "Price in cents"
        example: 4999
      isPremium:
        type: boolean
      isPublished:
        type: boolean
      createdAt:
        type: string
        format: date-time
  influencer:
    type: object
    nullable: true
    properties:
      id:
        type: integer
      name:
        type: string
      username:
        type: string
      avatarUrl:
        type: string
        nullable: true
        description: "Avatar image URL"
