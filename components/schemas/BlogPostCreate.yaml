type: object
required:
  - title
properties:
  title:
    type: string
    maxLength: 255
  preview:
    type: string
    maxLength: 500
    nullable: true
  content:
    type: string
    nullable: true
  isPremium:
    type: boolean
    default: false
  isPublished:
    type: boolean
    default: false
  price:
    type: number
    format: float
    description: Price in dollars
    nullable: true
  currency:
    type: string
    maxLength: 3
    description: ISO 4217 currency code (e.g. USD)
    nullable: true
