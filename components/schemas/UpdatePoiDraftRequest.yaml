type: object
required:
  - draft_version
description: >
  Draft POI update request. All fields are optional (nullable) to allow
  auto-saving incomplete data without validation errors.
  
  **Field Update Behavior:**
  - **Update Field:** Include the field with a value → Field is updated
  - **Clear Field:** Include the field with `null` or `""` (empty string) → Field is cleared (set to NULL)
  - **Skip Field:** Don't include the field → Field is not updated (remains unchanged)
  
  **Note:** While all fields are optional, type validation still applies
  (e.g., `country` must be 2 characters if provided, `placeType` must be
  a valid enum value if provided).
  
  The POI's status will be set to (or remain) `'draft'` after update.
  
  **Examples:**
  ```json
  // Update a field
  { "basic": { "name": "New Name" } }
  
  // Clear a field (both work the same)
  { "basic": { "summary": null } }
  { "basic": { "summary": "" } }
  
  // Partial update (only name is updated, summary remains unchanged)
  { "basic": { "name": "New Name" } }
  ```
properties:
  basic:
    type: object
    nullable: true
    description: Basic POI information (all fields optional)
    properties:
