          nullable: true
  experience:
    type: object
    nullable: true
    description: Experience description (optional)
    properties:
      experience:
        type: string
        maxLength: 2000
        nullable: true
  draft_version:
    type: integer
    minimum: 0
    description: >
      Version number for optimistic locking (required).
      
      **Must match the current `draftVersion` from the POI exactly.**
      
      The version is used to prevent concurrent edit conflicts:
      - Send the exact `draftVersion` value from the last POI response
      - Server checks if it matches the database version
      - On success: Version increments automatically, new version returned in response
      - On mismatch: Returns 409 Conflict with current POI state
      
      **Example Flow:**
      - Create POI → Response: `draftVersion: 0`
      - Update with `draft_version: 0` → Success, Response: `draftVersion: 1`
      - Update with `draft_version: 1` → Success, Response: `draftVersion: 2`
      - If you send `draft_version: 1` but DB is now `2` → 409 Conflict
