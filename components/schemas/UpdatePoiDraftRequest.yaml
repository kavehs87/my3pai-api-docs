        type: string
        maxLength: 2000
        nullable: true
      estimatedDuration:
        type: string
        maxLength: 64
        nullable: true
      country:
        type: string
        minLength: 2
        maxLength: 2
        nullable: true
      region:
        type: string
        maxLength: 128
        nullable: true
      address:
        type: string
        maxLength: 500
        nullable: true
      pinAccuracy:
        type: string
        enum: [exact, approximate, estimate]
        nullable: true
      phone:
        type: string
        maxLength: 64
        nullable: true
      website:
        type: string
        format: uri
        maxLength: 255
        nullable: true
      openingHours:
        type: string
        maxLength: 512
        nullable: true
      placeId:
        type: string
        maxLength: 255
        nullable: true
      myScore:
        type: number
        format: float
        minimum: 0
        maximum: 10
        nullable: true
        description: User's personal rating (0.00-10.00 scale)
      googleRating:
        type: number
        format: float
        minimum: 0
        maximum: 5
        nullable: true
        description: Google Places API rating (0-5 scale)
      googleRatingCount:
        type: integer
        minimum: 0
        nullable: true
        description: Number of Google reviews/ratings
      latitude:
        type: number
        format: double
        minimum: -90
        maximum: 90
        nullable: true
      longitude:
        type: number
        format: double
        minimum: -180
        maximum: 180
        nullable: true
  category:
    type: object
    nullable: true
    description: Category and classification (all fields optional)
    properties:
      placeType:
        type: string
        enum: [food_drink, nature, culture, adventure, nightlife, shopping, wellness, accommodation, transportation, instagrammable, other]
        nullable: true
      activities:
        type: array
        maxItems: 20
        nullable: true
        items:
          type: string
      audience:
        type: array
        maxItems: 20
        nullable: true
        items:
          type: string
      ageRequirement:
        type: array
        maxItems: 5
        nullable: true
        items:
          type: string
          enum: [infant, kids, teens, adults, none]
      elevation:
        type: integer
        minimum: 0
        maximum: 9000
        nullable: true
  difficulty:
