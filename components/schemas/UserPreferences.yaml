type: object
properties:
  currency:
    type: string
    enum:
      - USD
      - EUR
      - GBP
      - JPY
  language:
    type: string
    enum:
      - en
      - es
      - fr
      - de
  timezone:
    type: string
  country:
    type: string
    nullable: true
    description: ISO 3166-1 alpha-2 country code (2 characters)
    pattern: "^[A-Z]{2}$"
    example: "US"
  notifications:
    type: object
    properties:
      email:
        type: boolean
      push:
        type: boolean
      marketing:
        type: boolean
  wants_to_become_influencer:
    type: boolean
  dark_theme:
    type: boolean
