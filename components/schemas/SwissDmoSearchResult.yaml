type: object
description: Unified search result from Swiss DMO (DZT-compatible shape).
properties:
  id:
    type: string
    description: Swiss DMO identifier (e.g., CH-00001)
  name:
    type: string
    description: Entity name
  place_type:
    type: string
    enum:
      - destination
      - attraction
      - tour
    description: Resource type
  summary:
    type: string
    nullable: true
    description: Short abstract/description
  tagline:
    type: string
    nullable: true
    description: Short disambiguating description
  latitude:
    type: number
    nullable: true
    description: Latitude coordinate
  longitude:
    type: number
    nullable: true
    description: Longitude coordinate
  thumbnailUrl:
    type: string
    format: uri
    nullable: true
    description: URL to primary photo/thumbnail
  website:
    type: string
    format: uri
    nullable: true
    description: Official website URL
  license:
    type: string
    format: uri
    nullable: true
    description: License URL
  accessType:
    type: string
    enum:
      - PUBLIC_DOMAIN
      - CC
      - RESERVED
      - UNKNOWN
    description: Access type classification
  isReusable:
    type: boolean
    description: Whether the entity can be reused
  source:
    type: string
    description: Data source identifier
    example: swiss_dmo
