type: object
properties:
  id:
    type: integer
  downloadUrl:
    type: string
    format: uri-reference
    nullable: true
    example: /api/media-assets/download?purchase=123
    description: >
      Relative auth-gated download endpoint for this purchase (e.g. /api/media-assets/download?purchase=123).
      Only present while the purchase is paid and within its download window; null otherwise.
      This is a redirect endpoint (302 to a short-lived S3 signed URL), never a long-lived file URL.
      Returned as a relative path so the browser resolves it against the frontend origin (which proxies
      /api to the backend) and the session cookie is sent — an absolute backend URL would be cross-origin
      and return 401 (F-038). The frontend should open/fetch this path via its configured API base
      (or plain relative fetch) without prepending a backend host.
  downloadExpiresAt:
    type: string
    format: date-time
  purchasedAt:
    type: string
    format: date-time
  isImmutable:
    type: boolean
    description: Whether an immutable snapshot of the file has been created
  paymentStatus:
    type: string
    enum:
      - pending
      - paid
      - failed
      - refunded
  amount_cents:
    type: integer
    nullable: true
    description: >
      Amount paid for this purchase, in cents. Rows created by the app after the
      2026-08-23 ledger fix always carry this; older rows may be null (the amount
      then exists only on the Stripe PaymentIntent referenced by the purchase).
  currency:
    type: string
    enum:
      - USD
    example: USD
    description: Only USD is supported (single-currency).
  mediaAsset:
    type: object
    nullable: true
    properties:
      id:
        type: integer
      title:
        type: string
      type:
        type: string
      image:
        type: string
        format: uri
        nullable: true
  influencer:
    type: object
    nullable: true
    properties:
      id:
        type: integer
      name:
        type: string
      username:
        type: string
  snapshot:
    type: object
    nullable: true
    description: Present when the purchase has an immutable snapshot
    properties:
      manifestPath:
        type: string
      timestamp:
        type: string
      createdAt:
        type: string
        format: date-time
      fileCount:
        type: integer
