allOf:
  - $ref: ./BlogPostPublic.yaml
  - type: object
    properties:
      content:
        type: string
        description: Full content (HTML/Markdown) - null if premium and not purchased
        nullable: true
      isLocked:
        type: boolean
        description: True if premium and user hasn't purchased
      isPublished:
        type: boolean
      viewsCount:
        type: integer
        minimum: 0
