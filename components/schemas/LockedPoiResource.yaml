type: object
description: Redacted POI teaser pin for locked/paywalled content — coordinates plus parent map buy context only (POI/MAP scope)
properties:
  id:
    type: integer
  isLocked:
    type: boolean
    description: Always true for this resource
    example: true
  basic:
    type: object
    properties:
      latitude:
        type: number
        format: float
      longitude:
        type: number
        format: float
    required:
      - latitude
      - longitude
  map:
    type: object
    description: Parent map buy context for the unlock CTA (titles/prices are public via marketplace cards)
    properties:
      id:
        type: integer
      slug:
        type: string
        nullable: true
      title:
        type: string
      price_cents:
        type: integer
        nullable: true
        description: Integer minor units (cents), never a float
      currency:
        type: string
        example: USD
    required:
      - id
      - currency
required:
  - id
  - isLocked
  - basic
  - map

