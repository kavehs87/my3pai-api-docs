type: object
description: Request body for searching DZT Knowledge Graph by geographic proximity using SPARQL.
required:
  - lat
  - lon
  - radiusKm
properties:
  lat:
    type: number
    minimum: -90
    maximum: 90
    description: Latitude of the center point
  lon:
    type: number
    minimum: -180
    maximum: 180
    description: Longitude of the center point
  radiusKm:
    type: integer
    minimum: 1
    maximum: 200
    description: Search radius in kilometers from the center point
  entityType:
    type: string
    enum:
      - event
      - poi
      - trail
      - region
    default: poi
    description: Filter by entity type. Default returns all tourism POIs (attractions, museums, landmarks, etc.)
  pageSize:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    description: Maximum number of results to return
  fastMode:
    type: boolean
    default: false
    description: When true, fetches only essential fields (id, name, type, coordinates) for faster discovery. Enrichment fields (address, pricing, license, etc.) will be null.
