type: object
properties:
  id:
    type: integer
  name:
    type: string
  email:
    type: string
  username:
    type: string
  avatar:
    type: string
    nullable: true
  stripe_account_id:
    type: string
  stripe_account_status:
    type: string
    enum:
      - active
      - pending
      - restricted
  stripe_onboarding_completed_at:
    type: string
    format: date-time
    nullable: true
  stripe_default_currency:
    type: string
  has_stripe_account:
    type: boolean
  is_stripe_account_active:
    type: boolean
  created_at:
    type: string
    format: date-time
