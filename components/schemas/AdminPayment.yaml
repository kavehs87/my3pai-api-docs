type: object
properties:
  id:
    type: integer
  order_id:
    type: integer
    nullable: true
    description: Null for standalone (order-less) payments
  order_number:
    type: string
    nullable: true
    description: Null when the linked order is missing (orphan payment)
  user:
    type: object
    nullable: true
    properties:
      id:
        type: integer
      name:
        type: string
      email:
        type: string
  influencer:
    type: object
    nullable: true
    description: Null for orphan payments (derived from the order's items)
    properties:
      id:
        type: integer
      name:
        type: string
      username:
        type: string
  amount_cents:
    type: integer
  platform_fee_cents:
    type: integer
  influencer_payout_cents:
    type: integer
  payment_method:
    type: string
    enum: [card, free, stripe, paypal]
    description: Gateway method recorded at charge time (card = Stripe card, free = zero-amount)
  status:
    type: string
    enum: [succeeded, failed, refunded, pending]
  stripe_payment_intent_id:
    type: string
    nullable: true
  processed_at:
    type: string
    format: date-time
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
