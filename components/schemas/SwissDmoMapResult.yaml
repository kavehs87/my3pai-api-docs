type: object
description: Map query result from Swiss DMO (DZT-compatible shape).
properties:
  id:
    type: string
  name:
    type: string
  place_type:
    type: string
    enum:
      - destination
      - attraction
      - tour
  summary:
    type: string
    nullable: true
  latitude:
    type: number
    nullable: true
  longitude:
    type: number
    nullable: true
  thumbnailUrl:
    type: string
    format: uri
    nullable: true
  website:
    type: string
    format: uri
    nullable: true
  accessType:
    type: string
    enum:
      - PUBLIC_DOMAIN
      - CC
      - RESERVED
      - UNKNOWN
  isReusable:
    type: boolean
  source:
    type: string
    example: swiss_dmo
