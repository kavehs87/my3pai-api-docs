type: object
properties:
  id:
    type: integer
  title:
    type: string
  slug:
    type: string
  preview:
    type: string
    description: Short excerpt (max 500 chars)
    nullable: true
  coverImage:
    type: string
    format: uri
    nullable: true
  isPremium:
    type: boolean
  publishedAt:
    type: string
    format: date-time
    nullable: true
  readTime:
    type: string
    description: 5 min read
  price:
    type: number
    description: Price in dollars (e.g., 3.00). Null if free or not set.
    nullable: true
  currency:
    type: string
    description: ISO 4217 currency code (e.g., USD). Defaults to USD.
    nullable: true
