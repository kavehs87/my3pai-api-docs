        properties:
          enabled:
            type: boolean
          start:
            type: string
            format: time
            nullable: true
          end:
            type: string
            format: time
            nullable: true
      friday:
        type: object
        properties:
          enabled:
            type: boolean
          start:
            type: string
            format: time
            nullable: true
          end:
            type: string
            format: time
            nullable: true
      saturday:
        type: object
        properties:
          enabled:
            type: boolean
          start:
            type: string
            format: time
            nullable: true
          end:
            type: string
            format: time
            nullable: true
      sunday:
