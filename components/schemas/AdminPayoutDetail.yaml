type: object
properties:
  id:
    type: integer
  influencer:
    type: object
    nullable: true
    properties:
      id:
        type: integer
      name:
        type: string
      username:
        type: string
      avatar_url:
        type: string
      email:
        type: string
  amount_cents:
    type: integer
  currency:
    type: string
  status:
    type: string
    enum: [paid, pending, failed]
  stripe_transfer_id:
    type: string
    nullable: true
  stripe_transfer_group:
    type: string
    nullable: true
  destination_bank:
    type: string
    nullable: true
  orders:
    type: array
    description: Distinct orders linked to this payout (usually one). Soft-deleted orders are still shown with order_deleted true; order-less payouts return [].
    items:
      type: object
      properties:
        order_id:
          type: integer
        order_number:
          type: string
        amount_cents:
          type: integer
        order_deleted:
          type: boolean
          description: True when the linked order was soft-deleted
  timeline:
    type: array
    items:
      type: object
      properties:
        event:
          type: string
        timestamp:
          type: string
          format: date-time
  paid_at:
    type: string
    format: date-time
    nullable: true
  failure_reason:
    type: string
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
