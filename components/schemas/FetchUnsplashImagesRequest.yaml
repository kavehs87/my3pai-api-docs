type: object
description: |
  Request to fetch images from Unsplash and save them to a POI.
  All fields except `poi_id` are optional, but at least one search field should be provided for meaningful results.
required:
  - poi_id
properties:
  poi_id:
    type: integer
    description: ID of the POI to associate the images with. Must be owned by the user or part of a map owned by the user.
    example: 1
  title:
    type: string
    nullable: true
    maxLength: 255
    description: POI title (used as primary search query)
    example: "Eiffel Tower"
  placeType:
    type: string
    nullable: true
    maxLength: 255
    description: Place type/category (used for secondary queries and fallback)
    example: "landmark"
  description:
    type: string
    nullable: true
    maxLength: 2000
    description: POI description (currently not used in query generation, reserved for future use)
    example: "Iconic iron tower in Paris"
  address:
    type: string
    nullable: true
    maxLength: 500
    description: POI address (location extracted from last comma-separated part)
    example: "Champ de Mars, 5 Avenue Anatole France, 75007 Paris, France"
  count:
    type: integer
    minimum: 1
    maximum: 30
    default: 8
    description: Number of images to fetch (capped at 30, Unsplash API limit)
    example: 8

