type: object
description: >
  Profile update request. Fields are optional for partial updates.

  Note: firstName and lastName are conditionally required:

  - Required if either firstName or lastName is provided (both must be provided
  together)

  - Required if updating other profile fields (username, bio, location, etc.)

  - Optional if only updating theme
properties:
  firstName:
    type: string
    maxLength: 255
    pattern: '^[\p{L}\p{M}\s\x27-]+$'
    nullable: true
    description: 'Required if lastName is provided or if updating other profile fields. Unicode letters, spaces, hyphens, apostrophes only'
  lastName:
    type: string
    maxLength: 255
    pattern: '^[\p{L}\p{M}\s\x27-]+$'
    nullable: true
    description: 'Required if firstName is provided or if updating other profile fields. Unicode letters, spaces, hyphens, apostrophes only'
  username:
    type: string
    maxLength: 255
    pattern: '^[a-z0-9_-]+$'
    nullable: true
    description: 'Lowercase letters, digits, underscores, hyphens only'
  bio:
    type: string
    maxLength: 1000
    nullable: true
  location:
    type: string
    maxLength: 255
    nullable: true
  tagline:
    type: string
    maxLength: 255
    nullable: true
  subLocation:
    type: string
    maxLength: 255
    nullable: true
  theme:
    type: string
    maxLength: 50
    nullable: true
    enum:
      - modern
      - minimal
      - basic
      - dark-blue
      - wanderluxe
      - wanderluxe-v2
    description: Profile theme for public influencer profile page
  tour_status:
    type: string
    nullable: true
    enum:
      - not_started
      - in_progress
      - skipped
      - completed
    description: Creator-tour lifecycle state (partial update, explicit null clears)
  tour_congrats_seen_at:
    type: string
    format: date-time
    nullable: true
    description: When the approval congrats was dismissed (partial update, explicit null clears)
  tour_completed_at:
    type: string
    format: date-time
    nullable: true
    description: When the tour was completed (partial update, explicit null clears)
