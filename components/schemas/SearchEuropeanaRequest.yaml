type: object
description: Request body for searching the Europeana API.
required:
  - query
properties:
  query:
    type: string
    maxLength: 500
    description: The search query (keyword, title, artist, place, period)
  mediaType:
    type: string
    enum:
      - IMAGE
      - TEXT
      - VIDEO
      - SOUND
      - 3D
    description: Filter by media type
  country:
    type: string
    maxLength: 128
    description: Filter by country
  language:
    type: string
    maxLength: 10
    description: Filter by language code
  provider:
    type: string
    maxLength: 255
    description: Filter by data provider
  reusableOnly:
    type: boolean
    description: Only return items with open reusability
  page:
    type: integer
    minimum: 1
    default: 1
  pageSize:
    type: integer
    minimum: 1
    maximum: 100
    default: 24
