type: object
description: |
  A search result from the DZT Knowledge Graph.
  For nearby search, includes coordinates and distance.
  For keyword search, title/description/locality may be null — fetch entity details for full data.
properties:
  dztUri:
    type: string
    format: uri
    description: The unique URI of the entity in the DZT Knowledge Graph
  title:
    type: string
    nullable: true
    description: Entity name
  description:
    type: string
    nullable: true
    description: Entity description
  entityType:
    type: string
    enum:
      - event
      - poi
      - trail
      - region
  locality:
    type: string
    nullable: true
    description: City or locality name
  region:
    type: string
    nullable: true
    description: Region or federal state
  thumbnailUrl:
    type: string
    format: uri
    nullable: true
    description: Thumbnail image URL
  originalUrl:
    type: string
    format: uri
    description: Generated URL to the entity on Open Data Germany
  license:
    type: string
    nullable: true
    description: License URL
  accessType:
    type: string
    enum:
      - PUBLIC_DOMAIN
      - CC
      - RESERVED
      - UNKNOWN
    description: Access type classification
  isReusable:
    type: boolean
    description: Whether the entity can be reused
  compliesWith:
    type: string
    nullable: true
    description: Domain Specification (DS) URI the entity complies with
  lat:
    type: number
    nullable: true
    description: Latitude (present for nearby search results)
  lon:
    type: number
    nullable: true
    description: Longitude (present for nearby search results)
  distanceKm:
    type: number
    nullable: true
    description: Distance in kilometers from search center (nearby search only)
