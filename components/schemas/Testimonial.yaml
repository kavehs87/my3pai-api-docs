type: object
properties:
  id:
    type: integer
    format: int64
  body:
    type: string
    description: Plain-text endorsement (tags stripped server-side).
  status:
    type: string
    enum: [pending, approved, rejected, hidden]
  is_featured:
    type: boolean
    description: At most 2 approved testimonials per creator are featured.
  author:
    $ref: FeedbackAuthor.yaml
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
