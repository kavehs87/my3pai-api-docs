type: object
properties:
  contact_email:
    type: string
    format: email
    nullable: true
    maxLength: 255
    example: "hello@example.com"
  contact_location:
    type: string
    nullable: true
    maxLength: 255
    example: "Bali, Indonesia"
  contact_phone:
    type: string
    nullable: true
    maxLength: 50
    example: "+1234567890"
  contact_message:
    type: string
    nullable: true
    maxLength: 1000
    example: "Feel free to reach out with any questions!"

