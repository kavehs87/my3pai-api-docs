type: object
description: A nearby POI result from DZT SPARQL query with all available fields inline. When `fastMode` is true, enrichment fields (summary, tagline, address, pricing, license, etc.) will be null or have default values.
properties:
  dztUri:
    type: string
    format: uri
    description: The unique URI of the entity in the DZT Knowledge Graph
  name:
    type: string
    nullable: true
    description: Entity name
  place_type:
    type: string
    description: Normalized entity type (tourist_attraction, museum, landmark, restaurant, etc.)
  summary:
    type: string
    nullable: true
    description: Full description of the entity
  tagline:
    type: string
    nullable: true
    description: Short disambiguating description
  latitude:
    type: number
    nullable: true
    description: Latitude coordinate
  longitude:
    type: number
    nullable: true
    description: Longitude coordinate
  distanceKm:
    type: number
    description: Distance in kilometers from search center (Haversine)
  street:
    type: string
    nullable: true
    description: Street address
  region:
    type: string
    nullable: true
    description: Region or federal state
  country:
    type: string
    nullable: true
    description: Country code (e.g., DE)
  postalCode:
    type: string
    nullable: true
    description: Postal code
  phone:
    type: string
    nullable: true
    description: Phone number
  website:
    type: string
    format: uri
    nullable: true
    description: Official website URL
  opening_hours:
    type: string
    nullable: true
    description: Opening hours (e.g., Mo-Fr 10:00-18:00)
  is_free:
    type: boolean
    description: Whether the entity is free to visit
  currency:
    type: string
    nullable: true
    description: Currency code for pricing (e.g., EUR)
  min_price:
    type: string
    nullable: true
    description: Minimum price
  max_price:
    type: string
    nullable: true
    description: Maximum price
  booking_link:
    type: string
    format: uri
    nullable: true
    description: URL to book tickets
  estimated_duration:
    type: string
    nullable: true
    description: Estimated duration (ISO 8601 duration, e.g., PT2H)
  license:
    type: string
    format: uri
    nullable: true
    description: License URL
  accessType:
    type: string
    enum:
      - PUBLIC_DOMAIN
      - CC
      - RESERVED
      - UNKNOWN
    description: Access type classification
  isReusable:
    type: boolean
    description: Whether the entity can be reused
