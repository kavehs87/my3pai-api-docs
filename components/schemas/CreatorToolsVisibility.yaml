type: object
description: Creator tools visibility settings for public profile
properties:
  blog:
    type: boolean
    description: Whether Blog section is visible on public profile
    example: true
  podcast:
    type: boolean
    description: Whether Podcast section is visible on public profile
    example: true
  masterclass:
    type: boolean
    description: Whether Training/Masterclass section is visible on public profile
    example: true
  maps:
    type: boolean
    description: Whether Maps section is visible on public profile
    example: true
  consultation:
    type: boolean
    description: Whether Consultations section is visible on public profile
    example: true
  media-assets:
    type: boolean
    description: Whether Digital Assets section is visible on public profile
    example: true
  creator:
    type: boolean
    description: Whether Creator Profile section is visible on public profile
    example: true
  social:
    type: boolean
    description: Whether Social Posts section is visible on public profile
    example: true
  social-links:
    type: boolean
    description: Whether Social Links section is visible on public profile
    example: true
  contact:
    type: boolean
    description: Whether the contact section is visible on the public profile (gated in all three themes) and whether the Contact Messages tab shows on the creator's dashboard. While false the public contact form and contact-info endpoints return 404.
    example: true
  order:
    type: array
    items:
      type: string
    description: Array of tool IDs in display order. If not provided, default order is used.
    example: ['masterclass', 'maps', 'blog', 'podcast', 'media-assets', 'consultation', 'social', 'social-links', 'creator']
  feedback:
    type: object
    description: Per-type feedback section switches (default all true).
    properties:
      comments:
        type: boolean
        description: Whether the comments section is enabled on this creator's items.
        example: true
      ratings:
        type: boolean
        description: Whether ratings/reviews are enabled on this creator's items.
        example: true
      testimonials:
        type: boolean
        description: Whether testimonials can be submitted on this creator's profile.
        example: true
