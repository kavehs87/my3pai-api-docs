type: object
properties:
  id:
    type: integer
  name:
    type: string
  email:
    type: string
    format: email
  avatar:
    type: string
    format: uri
    nullable: true
  picture:
    type: string
    format: uri
    nullable: true
    description: Same as avatar
  display_name:
    type: string
  first_name:
    type: string
  last_name:
    type: string
  joinedDate:
    type: string
    format: date-time
    nullable: true
    description: Date when the user joined (ISO 8601 format)
