type: object
properties:
  id:
    type: integer
  name:
    type: string
  email:
    type: string
    format: email
  avatar:
    type: string
    format: uri
    nullable: true
  picture:
    type: string
    format: uri
    nullable: true
    description: Same as avatar
  display_name:
    type: string
  first_name:
    type: string
  last_name:
    type: string
  username:
    type: string
    nullable: true
  role:
    type: string
    enum:
      - user
      - influencer
      - admin
  verified:
    type: boolean
  preferences:
    $ref: ./UserPreferences.yaml
    nullable: true
  joinedDate:
    type: string
    format: date-time
    nullable: true
    description: Date when the user joined (ISO 8601 format)
  hasPassword:
    type: boolean
  hasGoogleAccount:
    type: boolean
  influencer_application:
    $ref: ./InfluencerApplication.yaml
    nullable: true
    description: Latest influencer application (null if never applied). New in 2026-08-27 (Option B, pending_guard).
