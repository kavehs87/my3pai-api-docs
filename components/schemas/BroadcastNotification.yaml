type: object
description: >
  Payload sent over WebSocket when a notification is broadcast to the user.
  Mirrors the `toDatabase()` shape from `BaseNotification` (includes `audience` per D10).
  BroadcastChannel wraps it as `BroadcastNotificationCreated` on `private-App.Models.User.{id}`.
properties:
  audience:
    type: string
    enum:
      - customer
      - creator
      - admin
      - transactional
    example: customer
  category:
    type: string
    enum:
      - order
      - refund
      - consultation
      - media_asset
      - invoice
      - payout
      - stripe
      - video
      - contact
      - auth
      - admin
      - system
      - business
    example: order
  severity:
    type: string
    enum:
      - info
      - success
      - warning
      - error
    example: success
  title:
    type: string
    example: Payment Successful
  message:
    type: string
    nullable: true
    example: Your payment of $25.00 for Summer Map was confirmed.
  context:
    type: object
    nullable: true
    description: Structured context data (IDs, dates, amounts in cents).
    example:
      order_id: 123
      order_number: "ORD-ABC123"
      amount_cents: 2500
  action_url:
    type: string
    nullable: true
    example: "/profile?tab=order-detail&orderId=123"
    description: Verified deep-link (see Notification.yaml §4.8).
