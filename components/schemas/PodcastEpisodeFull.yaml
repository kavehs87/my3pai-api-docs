allOf:
  - $ref: ./PodcastEpisodePublic.yaml
  - type: object
    properties:
      audioUrl:
        type: string
        format: uri
        description: Null if premium and not purchased
        nullable: true
      durationSeconds:
        type: integer
        nullable: true
      isPremium:
        type: boolean
      price:
        type: number
        format: float
        description: Price in dollars (null if not premium)
        nullable: true
      currency:
        type: string
        example: USD
      isLocked:
        type: boolean
        description: True if premium and user hasn't purchased
      isPublished:
        type: boolean
      playsCount:
        type: integer
        minimum: 0
