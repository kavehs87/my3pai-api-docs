type: object
properties:
  id:
    type: integer
    description: Item identifier (table pk)
  type:
    type: string
    enum:
      - maps
      - masterclasses
      - consultations
      - media
      - blog
      - podcasts
    description: Sellable item type (morph map key)
  title:
    type: string
    description: Item title
  slug:
    type: string
    nullable: true
    description: SEO slug (null for consultations/media which use id)
  route:
    type: string
    nullable: true
    description: Frontend route (SPA). Maps use /m/{username}/{slug}, others use /influencers/{username}/...
    example: /m/alice/three-days-in-paris
  region:
    type: string
    nullable: true
    description: Primary destination/region (creator location fallback)
  destination:
    type: string
    nullable: true
    description: Alias for region
  is_free:
    type: boolean
    description: >
      True when the item is free (price_cents = 0). Free items pass through the
      marketplace without the for-sale/premium flags: free maps (is_for_sale=false,
      no price), free blog/podcast posts (is_premium=false, no price), and price-0
      masterclasses/consultations/media.
  price:
    type: object
    properties:
      price_cents:
        type: integer
        minimum: 0
        description: Price in minor units (cents)
      currency:
        type: string
        pattern: '^[A-Z]{3}$'
        example: USD
  price_cents:
    type: integer
    minimum: 0
    description: Price in cents (top-level convenience, same as price.price_cents)
  currency:
    type: string
    pattern: '^[A-Z]{3}$'
    example: USD
  price_formatted:
    type: string
    nullable: true
    description: Display-only formatted price (MoneyHelper::centsToDisplay). Never use for math.
    example: "12.50"
  media:
    type: object
    nullable: true
    properties:
      cover:
        type: string
        format: uri
        nullable: true
      thumb:
        type: string
        format: uri
        nullable: true
      cover_raw:
        type: string
        nullable: true
        description: Raw stored path before S3 URL resolution
      thumbhash:
        type: string
        nullable: true
        description: Base64 ThumbHash LQIP placeholder for the image (decode client-side for instant blur preview while the full asset loads). Null until the encoder job has run.
  cover:
    type: string
    format: uri
    nullable: true
  thumbhash:
    type: string
    nullable: true
    description: Base64 ThumbHash LQIP placeholder for the image (decode client-side for instant blur preview while the full asset loads). Null until the encoder job has run.
  thumbnailUrl:
    type: string
    format: uri
    nullable: true
  tags:
    type: array
    description: Sorted unique tag keys (direct product tags; maps additionally inherit their POIs' tags). Empty list when untagged.
    items:
      type: string
  creator:
    type: object
    properties:
      id:
        type: integer
      username:
        type: string
      display_name:
        type: string
      name:
        type: string
      avatar:
        type: string
        format: uri
        nullable: true
      verified:
        type: boolean
      location:
        type: string
        nullable: true
      tagline:
        type: string
        nullable: true
  cta_label:
    type: string
    enum:
      - View Map
      - Enroll Now
      - Book Now
      - Download
      - Read Now
      - Listen Now
      - View
  cta:
    type: string
  popularity:
    type: integer
    nullable: true
    description: Popularity score used for sort=popularity — views_count (maps/blog/masterclasses), plays_count (podcasts), download_count (media); consultations carry no view counter so theirs is 0
  rating:
    type: number
    format: float
    nullable: true
    description: Average rating across all item types (rating_sum / ratings_count). Null until reviews exist
  created_at:
    type: string
    format: date-time
    nullable: true
  updated_at:
    type: string
    format: date-time
    nullable: true
  social:
    type: object
    nullable: true
    description: Real social proof — likes from likes_count (all six types), views mirror popularity, comments from feedback counters
    properties:
      likes:
        type: integer
        description: Real like count (likes_count column), never a placeholder
      views:
        type: integer
        description: View/play/download count (mirrors popularity)
      comments:
        type: integer
required:
  - id
  - type
  - title
  - is_free
  - price
