type: object
description: Classification value with category for Swiss DMO resources.
properties:
  id:
    type: integer
  valueId:
    type: integer
  code:
    type: string
    description: Classification value code (e.g., mountain_resort)
  title:
    type: string
    description: Human-readable title (e.g., Mountain Resort)
  category:
    type: string
    description: Category name (e.g., placetype, routetype)
