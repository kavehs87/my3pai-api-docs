type: object
properties:
  id:
    type: integer
  purchasedAt:
    type: string
    format: date-time
  isImmutable:
    type: boolean
  currency:
    type: string
    enum:
      - USD
    example: USD
    description: Only USD is supported (single-currency).
    example: "USD"
  unitPrice:
    type: integer
    minimum: 0
    description: "Price per unit in cents"
    example: 15000
  totalPrice:
    type: integer
    minimum: 0
    description: "Total price in cents"
    example: 15000
  map:
    type: object
    nullable: true
    properties:
      id:
        type: integer
      title:
        type: string
      slug:
        type: string
      isPublished:
        type: boolean
      isForSale:
        type: boolean
      price_cents:
        type: string
        nullable: true
      poiCount:
        type: integer
      thumbnailUrl:
        type: string
        format: uri
        nullable: true
      pois:
        type: array
        items:
          $ref: ./PoiResource.yaml
  influencer:
    type: object
    nullable: true
    properties:
      id:
        type: integer
      name:
        type: string
      username:
        type: string
  snapshot:
    type: object
    nullable: true
    properties:
      manifestPath:
        type: string
      timestamp:
        type: string
      createdAt:
        type: string
        format: date-time
      fileCount:
        type: integer
