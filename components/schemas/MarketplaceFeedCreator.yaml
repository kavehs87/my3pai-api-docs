type: object
description: >
  One creator-grouped feed entry for the PWA swipe pager: the creator card,
  a featured flag, the spotlight video (the creator's READY profile intro
  video, or null when they have none), and the creator's top-N marketplace
  items (popularity-ranked, same shape as /marketplace/items entries).
  Marketplace Video assets are deliberately NOT used as spotlight: they are
  sellable goods, not creator representation, and remain ordinary purchasable
  items in `items`.
properties:
  creator:
    $ref: MarketplaceCreator.yaml
  featured:
    type: boolean
    description: True when the creator is admin-featured (influencer_settings.is_featured). Feed orders featured-first, then popular.
  spotlight_video:
    type: object
    nullable: true
    description: >
      The creator's READY profile intro video, or null. Public-safe metadata
      only — the private source file never leaves the server. Intro videos
      are free public content so requires_purchase is always false and
      playback_url is set whenever a ready video exists (streams via GET
      /influencers/{username}/intro-video/stream with HTTP Range support).
      Marketplace Video assets (sellable goods) are deliberately NOT used
      here — they remain ordinary purchasable items in `items`.
    properties:
      id:
        type: integer
        description: Creator id (intro videos have no asset id)
      title:
        type: string
        nullable: true
      type:
        type: string
        enum:
          - Video
      cover:
        type: string
        format: uri
        nullable: true
        description: Public intro thumbnail
      cover_thumbhash:
        type: string
        nullable: true
        description: Base64 ThumbHash LQIP placeholder for the spotlight cover. Null until the encoder job has run.
      price_cents:
        type: integer
        minimum: 0
        description: Always 0 — intro videos are free
      currency:
        type: string
        pattern: '^[A-Z]{3}$'
        example: USD
      requires_purchase:
        type: boolean
        description: Always false for intro videos
      playback_url:
        type: string
        format: uri
        nullable: true
        description: Range-capable intro stream URL, else null
      created_at:
        type: string
        format: date-time
        nullable: true
  items:
    type: array
    description: Top-N marketplace items for this creator (popularity-ranked, honors type/q/region filters)
    items:
      $ref: MarketplaceItem.yaml
required:
  - creator
  - featured
  - items
