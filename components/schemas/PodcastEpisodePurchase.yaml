type: object
properties:
  id:
    type: integer
  amount_cents:
    type: integer
    description: Purchase price in cents
  currency:
    type: string
    enum:
      - USD
    example: USD
    description: Only USD is supported (single-currency).
  purchasedAt:
    type: string
    format: date-time
  episode:
    $ref: ./PodcastEpisodeFull.yaml
  influencer:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      username:
        type: string
      avatarUrl:
        type: string
        format: uri
        nullable: true
