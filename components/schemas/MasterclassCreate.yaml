type: object
required:
  - title
properties:
  title:
    type: string
    maxLength: 255
  description:
    type: string
    maxLength: 2000
    nullable: true
  content:
    type: string
    nullable: true
  price:
    type: number
    format: float
    minimum: 0
    default: 0
  type:
    type: string
    enum:
      - course
      - guide
      - training
      - masterclass
    default: course
  isPremium:
    type: boolean
    default: false
  isPublished:
    type: boolean
    default: false
