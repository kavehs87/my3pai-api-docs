type: object
properties:
  blog_post:
    $ref: ./AdminBlogPost.yaml
  content:
    type: string
    nullable: true
  preview:
    type: string
    nullable: true
  sales:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
        buyer_name:
          type: string
        buyer_email:
          type: string
          nullable: true
        amount_cents:
          type: integer
        purchased_at:
          type: string
          format: date-time
