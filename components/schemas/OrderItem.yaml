type: object
properties:
  id:
    type: integer
  item_type:
    type: string
    enum:
      - consultation
      - masterclass
      - media_asset
  item_id:
    type: integer
  item_name:
    type: string
    description: Snapshot of item name at time of purchase
  item_description:
    type: string
    nullable: true
    description: Snapshot of item description at time of purchase
  quantity:
    type: integer
  unit_price_cents:
    type: integer
  unit_price_formatted:
    type: string
  total_price_cents:
    type: integer
  total_price_formatted:
    type: string
  currency:
    type: string
  metadata:
    type: object
    nullable: true
