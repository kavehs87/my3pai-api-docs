type: object
properties:
  id:
    type: integer
  item_type:
    type: string
    enum:
      - consultation
      - masterclass
      - media_asset
  item_id:
    type: integer
  item_name:
    type: string
    description: Snapshot of item name at time of purchase
  item_description:
    type: string
    nullable: true
    description: Snapshot of item description at time of purchase
  quantity:
    type: integer
  unit_price_cents:
    type: integer
  unit_price_formatted:
    type: string
  total_price_cents:
    type: integer
  total_price_formatted:
    type: string
  currency:
    type: string
    enum:
      - USD
    example: USD
    description: Only USD is supported (single-currency).
  creator_id:
    type: integer
    nullable: true
    description: Seller user id (order_items.influencer_id snapshot).
  creator_username:
    type: string
    nullable: true
    description: Seller username for "sold by" surfaces. No creator PII is exposed.
  metadata:
    type: object
    nullable: true
