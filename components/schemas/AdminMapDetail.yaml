type: object
properties:
  map:
    $ref: ./AdminMap.yaml
  sales:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
        buyer_name:
          type: string
        buyer_email:
          type: string
          nullable: true
        amount_cents:
          type: integer
        purchased_at:
          type: string
          format: date-time
  pois:
    type: array
    description: POIs on this map (id, name, status, coordinates)
    items:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
