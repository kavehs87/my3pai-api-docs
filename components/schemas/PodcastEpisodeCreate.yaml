type: object
required:
  - title
properties:
  title:
    type: string
    maxLength: 255
  description:
    type: string
    maxLength: 2000
    nullable: true
  duration:
    type: string
    maxLength: 32
    nullable: true
  durationSeconds:
    type: integer
    minimum: 0
    nullable: true
  isPremium:
    type: boolean
    default: false
  price:
    type: number
    format: float
    description: Price in dollars (stored as cents in DB)
    nullable: true
  currency:
    type: string
    default: USD
    description: ISO 4217 currency code
  isPublished:
    type: boolean
    default: false
