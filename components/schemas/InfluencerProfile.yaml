type: object
properties:
  id:
    type: integer
  username:
    type: string
  firstName:
    type: string
  lastName:
    type: string
  avatar:
    type: string
    format: uri
    nullable: true
  coverImage:
    type: string
    format: uri
    nullable: true
  logo:
    type: string
    format: uri
    nullable: true
    description: Logo image URL for the influencer's public profile
  bio:
    type: string
    nullable: true
  tagline:
    type: string
    nullable: true
  location:
    type: string
    nullable: true
  subLocation:
    type: string
    nullable: true
  theme:
    type: string
    maxLength: 50
    nullable: true
    enum:
      - modern
      - minimal
      - basic
      - dark-blue
      - wanderluxe
      - wanderluxe-v2
    description: >-
      Profile theme for public influencer profile page (defaults to 'modern' if
      not set)
  theme_settings:
    type: object
    description: Current theme's customization (public subset; other themes stay private)
  verified:
    type: boolean
  followers_count:
    type: integer
    description: Number of users following this creator (0 when the follows table is empty).
  following_count:
    type: integer
    description: Number of creators this creator follows.
  is_following:
    type: boolean
    nullable: true
    description: Whether the current viewer follows this creator. Null for guests. Injected outside the overview cache so per-viewer state never leaks across viewers.
  stats:
    $ref: ./InfluencerStats.yaml
  socials:
    type: array
    items:
      $ref: ./UserSocial.yaml
  languages:
    type: array
    items:
      $ref: ./UserLanguage.yaml
  skills:
    type: array
    items:
      type: string
  certifications:
    type: array
    items:
      $ref: ./UserCertification.yaml
  externalLinks:
    type: array
    items:
      $ref: ./UserExternalLink.yaml
  introVideoUrl:
    type: string
    format: uri
    nullable: true
    description: URL to the intro video
  introVideoThumbnail:
    type: string
    format: uri
    nullable: true
    description: URL to the intro video thumbnail
  introVideoDuration:
    type: integer
    nullable: true
    description: Duration in seconds
  creatorToolsVisibility:
    $ref: ./CreatorToolsVisibility.yaml
    nullable: true
    description: Creator tools visibility settings for public profile (defaults to all enabled if not set)
