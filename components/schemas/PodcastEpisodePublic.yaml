type: object
properties:
  id:
    type: integer
  title:
    type: string
  slug:
    type: string
  description:
    type: string
    nullable: true
  coverImage:
    type: string
    format: uri
    nullable: true
  detailCoverImage:
    type: string
    format: uri
    nullable: true
    description: Cover image for the single episode detail view
  duration:
    type: string
    description: 45 min
    nullable: true
  isPremium:
    type: boolean
  price_cents:
    type: integer
    description: Price in cents (null if free)
    nullable: true
  currency:
    type: string
    enum:
      - USD
    example: USD
    description: Only USD is supported (single-currency).
  tags:
    type: array
    items:
      type: string
    description: Array of tag key strings for this episode
  publishedAt:
    type: string
    format: date-time
    nullable: true
