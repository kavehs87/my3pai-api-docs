type: object
properties:
  id:
    type: integer
  title:
    type: string
  slug:
    type: string
  description:
    type: string
    nullable: true
  coverImage:
    type: string
    format: uri
    nullable: true
  duration:
    type: string
    description: 45 min
    nullable: true
  isPremium:
    type: boolean
  price:
    type: number
    format: float
    description: Price in dollars (null if free)
    nullable: true
  currency:
    type: string
    example: USD
  publishedAt:
    type: string
    format: date-time
    nullable: true
