type: object
properties:
  id:
    type: integer
  consultation:
    $ref: ./Consultation.yaml
  scheduledAt:
    type: string
    format: date-time
    description: Scheduled time in UTC (ISO 8601 format)
  status:
    type: string
    enum:
      - pending
      - confirmed
      - completed
      - cancelled
  paymentStatus:
    type: string
    enum:
      - pending
      - paid
      - refunded
  videoCallLink:
    type: string
    format: uri
    nullable: true
  notes:
    type: string
    nullable: true
  influencer:
    type: object
    nullable: true
    properties:
      id:
        type: integer
