type: object
properties:
  id:
    type: integer
  consultation:
    $ref: ./Consultation.yaml
  scheduledAt:
    type: string
    format: date-time
    description: Scheduled time in UTC (ISO 8601 format)
  status:
    type: string
    enum:
      - pending
      - confirmed
      - completed
      - cancelled
  paymentStatus:
    type: string
    enum:
      - pending
      - paid
      - refunded
  price_cents_charged:
    type: integer
    minimum: 0
    nullable: true
    description: Snapshot of what the buyer actually paid (integer cents), set once at booking creation and never mutated by later price edits. Null only for rows predating the snapshot column — fall back to consultation.price_cents.
  videoCallLink:
    type: string
    format: uri
    nullable: true
  notes:
    type: string
    nullable: true
  influencer:
    type: object
    nullable: true
    properties:
      id:
        type: integer
