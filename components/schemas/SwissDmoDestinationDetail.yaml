type: object
description: Destination detail from Swiss DMO.
properties:
  id:
    type: string
    description: Swiss DMO identifier (e.g., CH-00001)
  name:
    type: string
  placeType:
    type: string
    enum: [destination]
    example: destination
  summary:
    type: string
    nullable: true
  description:
    type: string
    nullable: true
    description: Full description
  latitude:
    type: number
    nullable: true
  longitude:
    type: number
    nullable: true
  thumbnailUrl:
    type: string
    format: uri
    nullable: true
  website:
    type: string
    format: uri
    nullable: true
  license:
    type: string
    format: uri
    nullable: true
  accessType:
    type: string
    enum: [PUBLIC_DOMAIN, CC, RESERVED, UNKNOWN]
  isReusable:
    type: boolean
  source:
    type: string
    example: swiss_dmo
  category:
    type: string
    nullable: true
  population:
    type: integer
    nullable: true
  resortKey:
    type: string
    nullable: true
    description: STN:ET resort key
  classifications:
    type: array
    items:
      $ref: ./SwissDmoClassification.yaml
  images:
    type: array
    items:
      $ref: ./SwissDmoImage.yaml
