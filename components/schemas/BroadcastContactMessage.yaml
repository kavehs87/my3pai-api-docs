type: object
description: >
  Payload sent over WebSocket when a new contact message is received by an
  influencer. Broadcast on `App.Models.User.{influencer_id}` channel as event
  `App\Events\NewContactMessage`.
properties:
  id:
    type: integer
    description: Contact message ID
    example: 42
  name:
    type: string
    description: Sender's name
    example: John Doe
  email:
    type: string
    format: email
    description: Sender's email
    example: john@example.com
  subject:
    type: string
    enum:
      - general
      - course
      - business
      - press
    description: Message subject category
    example: business
  message:
    type: string
    description: Full message body
    example: I would like to discuss a collaboration opportunity.
  is_read:
    type: boolean
    description: Whether the influencer has read this message
    example: false
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the message was created
    example: "2025-06-15T10:30:00+00:00"
