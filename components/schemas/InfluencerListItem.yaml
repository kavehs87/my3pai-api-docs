type: object
properties:
  id:
    type: integer
  username:
    type: string
    description: Used for /influencer/{username} links
  name:
    type: string
    description: Display name (firstName + lastName or display_name)
  avatar:
    type: string
    format: uri
    nullable: true
  cover_image:
    type: string
    format: uri
    nullable: true
    description: Profile cover image for full-bleed cards. May be null — fall back to latest map thumbnail, then avatar, then a themed gradient.
  location:
    type: string
    nullable: true
  tagline:
    type: string
    nullable: true
  verified:
    type: boolean
  followers_count:
    type: integer
    description: Number of users following this creator (0 when the follows table is empty).
  following_count:
    type: integer
    description: Number of creators this creator follows.
  is_following:
    type: boolean
    nullable: true
    description: Whether the current viewer follows this creator. Null for guests (unknown, never false).
  stats:
    type: array
    items:
      type: object
      properties:
        platform:
          type: string
          enum:
            - instagram
            - youtube
            - tiktok
            - twitter
            - facebook
            - linkedin
            - maps
            - locations
          description: Social platform or maps/locations for MVP
        count:
          type: string
          description: Human-readable count e.g. "54k", "1.2M", "500"
  maps:
    type: array
    items:
      $ref: ./MapResource.yaml
    nullable: true
    description: Populated when `include_maps` > 0, includes published maps per influencer (up to the requested limit).
