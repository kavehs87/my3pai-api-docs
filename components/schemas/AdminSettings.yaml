type: object
properties:
  platform_name:
    type: string
  support_email:
    type: string
    format: email
  default_currency:
    type: string
    enum:
      - usd
    description: Only USD is supported (single-currency).
  timezone:
    type: string
  platform_fee_percentage:
    type: integer
  platform_fee_min_amount_cents:
    type: integer
    nullable: true
    description: Minimum platform fee in cents per order line item. null = no minimum.
  platform_fee_max_amount_cents:
    type: integer
    nullable: true
    description: Maximum platform fee in cents per order line item. null = no maximum.
  minimum_payout_threshold_cents:
    type: integer
  free_order_threshold_cents:
    type: integer
  min_order_amount_cents:
    type: integer
    nullable: true
    description: Minimum paid order subtotal in cents. Orders below it are rejected at checkout with code ORDER_BELOW_MINIMUM. null = gate disabled. Seeded default 400 ($4.00).
  auto_flag_keywords:
    type: string
  max_upload_size_mb:
    type: integer
  allowed_file_types:
    type: string
  feature_maps_sales:
    type: boolean
  feature_consultations:
    type: boolean
  feature_premium_blog:
    type: boolean
  feature_premium_podcast:
    type: boolean
  feature_masterclasses:
    type: boolean
  feature_media_assets_marketplace:
    type: boolean
  password_min_length:
    type: integer
  password_require_complexity:
    type: boolean
  session_timeout_minutes:
    type: integer
  rate_limit_overrides:
    type: object
    additionalProperties: true
