type: object
description: Attraction detail from Swiss DMO.
properties:
  id:
    type: string
    description: Swiss DMO identifier (e.g., CH-10001)
  name:
    type: string
  placeType:
    type: string
    enum: [attraction]
    example: attraction
  summary:
    type: string
    nullable: true
  description:
    type: string
    nullable: true
  latitude:
    type: number
    nullable: true
  longitude:
    type: number
    nullable: true
  thumbnailUrl:
    type: string
    format: uri
    nullable: true
  website:
    type: string
    format: uri
    nullable: true
  license:
    type: string
    format: uri
    nullable: true
  accessType:
    type: string
    enum: [PUBLIC_DOMAIN, CC, RESERVED, UNKNOWN]
  isReusable:
    type: boolean
  source:
    type: string
    example: swiss_dmo
  isFree:
    type: boolean
    nullable: true
  openingHours:
    type: string
    nullable: true
  recommendedSeason:
    type: string
    nullable: true
  isTop:
    type: boolean
    nullable: true
  isSelfGuided:
    type: boolean
    nullable: true
  reservationRequired:
    type: boolean
    nullable: true
  price:
    type: string
    nullable: true
  email:
    type: string
    nullable: true
  telephone:
    type: string
    nullable: true
  tourBookingPage:
    type: string
    format: uri
    nullable: true
  classifications:
    type: array
    items:
      $ref: ./SwissDmoClassification.yaml
  images:
    type: array
    items:
      $ref: ./SwissDmoImage.yaml
