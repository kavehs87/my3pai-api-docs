type: object
properties:
  id:
    type: integer
    format: int64
  body:
    type: string
    description: Plain-text body (tags stripped server-side).
  parent_id:
    type: integer
    format: int64
    nullable: true
    description: Null for top-level comments; set for one-level replies.
  author:
    $ref: FeedbackAuthor.yaml
  replies:
    type: array
    description: Present only when ?include_replies=1 on the list endpoint.
    items:
      $ref: Comment.yaml
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
