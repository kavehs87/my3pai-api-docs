post:
  tags:
    - Admin Payouts
  summary: Retry failed payout
  description: Retry a failed payout by resetting its status to pending. Only payouts with status 'failed' can be retried.
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Payout retry initiated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Payout not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error - payout status is not 'failed'
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
