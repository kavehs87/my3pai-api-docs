get:
  tags:
    - Public
  summary: Health check
  description: Returns the health status of the API
  security: []
  responses:
    '200':
      description: API is running
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              message:
                type: string
                example: My3PAI API is running
              timestamp:
                type: string
                format: date-time
                example: '2025-01-27T12:00:00Z'
