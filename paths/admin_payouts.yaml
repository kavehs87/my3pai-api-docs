get:
  tags:
    - Admin Payouts
  summary: List payouts
  description: Paginated list of all influencer payouts with filtering
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: status
      in: query
      schema:
        type: string
        enum: [paid, pending, failed]
    - name: influencer_id
      in: query
      schema:
        type: integer
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: sort
      in: query
      schema:
        type: string
        enum: [amount, status, created_at]
        default: created_at
    - name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  responses:
    '200':
      description: Paginated list of payouts
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  payouts:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminPayout.yaml
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
