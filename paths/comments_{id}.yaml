patch:
  tags:
    - Feedback
  summary: Edit your comment
  description: Own comments only, within a 30-minute window (422 after expiry).
  operationId: updateComment
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - body
          properties:
            body:
              type: string
              minLength: 2
              maxLength: 1000
  responses:
    '200':
      description: Updated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Comment.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Not the author / not verified / banned
    '404':
      description: Comment not found
    '422':
      description: Edit window expired or validation failure
delete:
  tags:
    - Feedback
  summary: Delete your comment
  description: Own comments only (soft delete). Replies re-parent to top level.
  operationId: deleteComment
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Deleted
    '401':
      description: Unauthenticated
    '403':
      description: Not the author / not verified / banned
    '404':
      description: Comment not found
