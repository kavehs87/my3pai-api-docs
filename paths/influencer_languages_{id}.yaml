put:
  tags:
    - Influencers
  summary: Update language
  description: Update an existing language
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            languageCode:
              type: string
              minLength: 2
              maxLength: 2
            languageName:
              type: string
              maxLength: 255
            level:
              type: string
              enum:
                - native
                - fluent
                - conversational
                - basic
            sortOrder:
              type: integer
              minimum: 0
              nullable: true
  responses:
    '200':
      description: Language updated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/UserLanguage.yaml
              message:
                type: string
    '404':
      description: Language not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
delete:
  tags:
    - Influencers
  summary: Delete language
  description: Delete a language
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Language deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
    '404':
      description: Language not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
