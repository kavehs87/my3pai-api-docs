get:
  tags:
    - Admin
  summary: Export invoices as CSV
  description: Export filtered invoices as a CSV file (admin only)
  parameters:
    - name: status
      in: query
      schema:
        type: string
        enum: [paid, unpaid, overdue, cancelled]
    - name: perspective
      in: query
      schema:
        type: string
        enum: [sent, received]
    - name: user_id
      in: query
      schema:
        type: integer
    - name: influencer_id
      in: query
      schema:
        type: integer
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: search
      in: query
      schema:
        type: string
  responses:
    '200':
      description: CSV file download
      content:
        text/csv:
          schema:
            type: string
            format: binary
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
