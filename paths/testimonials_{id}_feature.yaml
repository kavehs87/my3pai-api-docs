post:
  tags:
    - Feedback
  summary: Feature/unfeature a testimonial (creator)
  description: |
    Profile owner only, approved testimonials only. Toggle endpoint; at most
    2 featured per creator (third feature is rejected with 422).
  operationId: featureTestimonial
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Toggled
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Testimonial.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Not the profile owner / not verified / banned
    '404':
      description: Testimonial not found
    '422':
      description: Not approved, or feature cap reached
