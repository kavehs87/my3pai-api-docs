get:
  tags:
    - Admin
  summary: List social posts
  description: Get paginated list of social posts with optional filters (admin only)
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
        minimum: 1
    - name: search
      in: query
      schema:
        type: string
        maxLength: 255
    - name: platform
      in: query
      schema:
        type: string
        enum:
          - YouTube
          - Instagram
          - TikTok
          - Facebook
          - YouTube Shorts
    - name: type
      in: query
      schema:
        type: string
        enum:
          - youtube
          - short-form
    - name: status
      in: query
      schema:
        type: string
        enum:
          - published
          - draft
    - name: author_id
      in: query
      schema:
        type: integer
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: sort
      in: query
      schema:
        type: string
        enum:
          - title
          - created_at
          - updated_at
          - platform
          - order
        default: created_at
    - name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
  responses:
    '200':
      description: Paginated list of social posts
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  social_posts:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminSocialPost.yaml
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
