post:
  tags:
    - DZT
  summary: Search nearby POIs from local cache
  description: |
    Search locally cached DZT (Open Data Germany) POIs within a radius of given
    coordinates. Queries the local database for instant response — no external API call.

    Results are filtered by Haversine distance and sorted by distance ascending.
    Same response shape as `POST /dzt/nearby` (SPARQL version).

    Any authenticated user can call this endpoint — no POI ownership required.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SearchDztNearbySparqlRequest.yaml
  responses:
    '200':
      description: Nearby POIs from cache sorted by distance
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: ../components/schemas/PoiDztNearbyResult.yaml
                  total:
                    type: integer
                    description: Number of results within radius
                  centerLat:
                    type: number
                    description: Center latitude of search
                  centerLon:
                    type: number
                    description: Center longitude of search
                  radiusKm:
                    type: integer
                    description: Search radius in kilometers
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
