post:
  tags:
    - Messages
  summary: Archive or un-archive a thread for me
  description: >
    Per-side archive. A hidden thread leaves the requester's list and unread
    count but stays directly fetchable — hiding is not deletion. New activity
    un-hides for both sides. Omit `hidden` to archive (default true); pass
    `false` to un-archive.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            hidden:
              type: boolean
              default: true
  responses:
    '200':
      description: Archive state updated.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  hidden:
                    type: boolean
    '401':
      description: Unauthenticated.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Unknown id or not a participant — identical body either way.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '429':
      description: Rate limit exceeded (30/min)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
