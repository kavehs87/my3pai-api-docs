post:
  tags:
    - Authentication
  summary: Login user
  description: Authenticate user with email and password
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginRequest.yaml
        examples:
          default:
            value:
              email: jane@example.com
              password: secret123
  responses:
    '200':
      description: Login successful
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthResponse.yaml
    '401':
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Email not verified or account suspended
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        examples:
          email_not_verified:
            summary: Email not verified
            value:
              success: false
              error: Please verify your email before logging in.
          account_suspended:
            summary: Account suspended
            value:
              success: false
              error: "Your account has been suspended. Reason: Violation of terms. Suspended until: 2025-08-01"
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '429':
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
