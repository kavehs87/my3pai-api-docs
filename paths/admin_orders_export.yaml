get:
  tags:
    - Admin
  summary: Export orders as CSV
  description: Export orders to CSV with optional filters (admin only)
  parameters:
    - name: status
      in: query
      schema:
        type: string
        enum: [pending, completed, refunded, cancelled, partially_refunded]
    - name: payment_status
      in: query
      schema:
        type: string
        enum: [paid, unpaid, refunded]
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: search
      in: query
      schema:
        type: string
  responses:
    '200':
      description: CSV file download
      content:
        text/csv:
          schema:
            type: string
            format: binary
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
