post:
  tags:
    - Consultations
  summary: Book a consultation
  description: >
    Book a consultation slot for a customer. 


    The endpoint automatically checks for time slot conflicts:

    - Prevents overlapping bookings (considers consultation duration)

    - Only checks pending and confirmed bookings (ignores cancelled/completed)

    - Returns HTTP 409 if the requested time slot overlaps with an existing
    booking


    Use the availability endpoints to check available slots before booking.
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      description: Consultation ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ConsultationBookRequest.yaml
  responses:
    '201':
      description: Booking created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  booking:
                    $ref: ../components/schemas/ConsultationBooking.yaml
                  paymentIntent:
                    oneOf:
                      - type: object
                        properties:
                          clientSecret:
                            type: string
                            description: Stripe payment intent client secret
                          amount_cents:
                            type: integer
                            description: Amount in cents
                          currency:
                            type: string
                            description: Currency code (e.g., usd)
                      - type: 'null'
                    description: >
                      Stripe payment intent for paid consultations. `null` for free
                      consultations (consultation.price_cents = 0) — no payment step,
                      the booking is confirmed immediately with paymentStatus "paid".
              message:
                type: string
    '400':
      description: Cannot book own consultation or malformed input
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Consultation not found, not active, or hidden from the public profile
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '409':
      description: Time slot already booked
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: >
        Validation error. A paid consultation from a payment-unready creator is
        refused with error code `CREATOR_PAYMENT_NOT_READY` for every unready
        state (Stripe account not connected, not active, or restricted) — the
        refusal happens before any booking/order row is written. Free
        consultations (consultation.price_cents = 0) are never refused here.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ValidationError.yaml
              - type: object
                properties:
                  code:
                    type: string
                    example: CREATOR_PAYMENT_NOT_READY
    '500':
      description: Payment processing setup failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
