post:
  tags:
    - AI
  summary: Influencer MCP (Streamable HTTP)
  description: |
    Influencer MCP endpoint (map/poi/blog/consultation/contact/feedback/sales/profile only, own content).
    Blog tools: `blog_list` (own posts, featured-first, with
    featured_count/featured_max meta), `blog_create` (draft by default,
    content sanitized as blog HTML, same validation as POST /influencer/blog),
    `blog_update` (partial update, title change regenerates the slug, same
    validation as PUT /influencer/blog/{id}), `blog_delete` (confirm guard,
    removes the cover file) and the pinning pair `blog_feature` /
    `blog_unfeature` (pin one PUBLISHED post to the top of the public profile
    home; max 4, drafts error, unpin always allowed). Consultation tools:
    `consultation_settings_get` / `consultation_settings_update` (partial
    upsert of the creator's own consultation settings; the full set is
    required on first creation, same field validation as PUT
    /influencer/consultation), `consultation_visibility_set` (public profile
    visibility only), and the booking lifecycle on the creator's own
    consultation `consultation_bookings_list` / `consultation_booking_get` /
    `consultation_bookings_stats` / `consultation_booking_confirm` /
    `consultation_booking_decline` / `consultation_booking_complete` (same
    state rules as the REST /influencer/consultation/bookings endpoints;
    declining a paid booking refunds the customer). Contact tools:
    `contact_messages_list` / `contact_message_get` (viewing marks it read,
    like the REST endpoint) / `contact_message_set_read` /
    `contact_message_delete` (confirm guard) / `contact_messages_stats` /
    `contact_settings_get` / `contact_settings_update` (partial update of the
    public contact details, null clears, contact_message sanitized) /
    `contact_visibility_set` (show or hide the public contact section; the
    public form and contact-info return 404 while hidden). Feedback tools
    moderate customer comments, ratings and testimonials on the creator's own
    content only (item types: map, blog_post, masterclass, podcast_episode,
    media_asset, consultation): `feedback_comments_list` /
    `feedback_ratings_list` (public view by default; `include_hidden` adds
    hidden rows with `hidden_reason` for moderation triage; hidden_count
    meta), `feedback_rating_summary` (avg/count/distribution),
    `feedback_comment_set_hidden` / `feedback_rating_set_hidden` (hide or
    restore; hiding updates item counters and notifies the author, restoring
    is silent), `feedback_testimonials_pending` (the creator's curation
    queue), `feedback_testimonials_list` (approved, featured-first),
    `feedback_testimonial_approve` / `feedback_testimonial_reject` (pending
    only) / `feedback_testimonial_set_featured` (approved only, max 2
    featured) / `feedback_testimonial_delete` (confirm guard) and
    `feedback_visibility_set` (show or hide a whole section — comments,
    ratings or testimonials; hidden sections list empty and block new
    submissions, same as the REST creator-tools-visibility feedback flags).
    Foreign items/ids return not found. Sales tools are read-only views of
    the creator's OWN money records only (integer *_cents): `sales_orders_list`
    / `sales_order_show` (orders sold; buyer name+email for fulfillment, no
    billing address) / `sales_order_download` (receipt PDF link, 15 min) /
    `sales_summary` (gross/fees/payout per currency over completed+paid
    sales), `sales_invoices_list` / `sales_invoice_show` /
    `sales_invoice_download` / `sales_invoice_send` (resends the receipt to
    the buyer only), `sales_payouts_list` / `sales_payout_show` (with the
    platform-fee ledger rows), `sales_earnings_summary` (paid/pending/fees
    net of reversals — same service as the REST earnings dashboard),
    `sales_stripe_status` (own Connect account, syncs local status) and
    `sales_stripe_dashboard` (own Express login link). Cancelling orders,
    refunds, payouts and Stripe onboarding/disconnect stay dashboard or
    admin-only. Profile tools design the creator's OWN public profile only
    (username immutable): `profile_get` / `profile_update` (partial, same
    rules as REST) / `profile_set_media` + `profile_clear_media` (avatar,
    cover, logo — same files as the dashboard produces). Theme design
    (colors, fonts, texts, images, section order/visibility; no custom
    CSS/HTML/JS can ever persist): `theme_schema_get` (always read first),
    `theme_settings_get`, `theme_settings_update` (MERGE semantics — only
    provided keys change, null deletes, lists replace; same validation as
    the dashboard), `theme_image_upload` (CDN hosting for image slots, 20
    per creator) / `theme_images_list` / `theme_image_delete` (confirm,
    own-prefix scoped). Identity collections (socials, languages, skills,
    certifications, external_links): `identity_list` / `identity_create` /
    `identity_update` / `identity_delete` (confirm) / `identity_reorder` —
    all scoped to the creator, same validation as REST. Password changes,
    account deletion and preferences stay dashboard-only. Requires Sanctum +
    mcp-influencer ability + verified/banned/influencer + throttle 120/min.
    See InfluencerMcpServer.
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            jsonrpc: { type: string, example: '2.0' }
            id: { type: integer }
            method: { type: string, example: tools/call }
            params: { type: object }
  responses:
    '200':
      description: MCP JSON-RPC response
      content:
        application/json:
          schema:
            type: object
            properties:
              jsonrpc: { type: string }
              id: { type: integer }
              result: { type: object }
    '401': { description: Unauthorized, content: { application/json: { schema: { $ref: ../components/schemas/ErrorResponse.yaml } } } }
    '403': { description: Forbidden, content: { application/json: { schema: { $ref: ../components/schemas/ErrorResponse.yaml } } } }
    '429': { description: Throttled 120/min, content: { application/json: { schema: { $ref: ../components/schemas/ErrorResponse.yaml } } } }
get:
  tags:
    - AI
  summary: Influencer MCP GET (same)
  security:
    - BearerAuth: []
  responses:
    '200': { description: MCP response, content: { application/json: { schema: { type: object } } } }
