post:
  tags:
    - Feedback
  summary: Unhide a comment (item owner)
  description: Reverses hide; counters re-increment. No notification on unhide.
  operationId: unhideComment
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Unhidden
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Comment.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Not the item owner / not verified / banned
    '404':
      description: Comment not found
