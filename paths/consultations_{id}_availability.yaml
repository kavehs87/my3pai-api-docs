get:
  tags:
    - Public
    - Consultations
  summary: Get consultation availability by ID (booked time slots)
  description: >-
    Get booked/occupied time slots for a consultation by consultation ID. Used
    by calendar widgets to disable unavailable time slots. Returns only pending
    and confirmed bookings (excludes cancelled and completed).
  security: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      description: Consultation ID
    - name: start_date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Start date for availability range (defaults to today)
      example: '2024-02-01'
    - name: end_date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: End date for availability range (defaults to 90 days from start)
      example: '2024-02-29'
  responses:
    '200':
      description: Consultation availability data
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/ConsultationAvailability.yaml
    '404':
      description: Consultation not found or not active
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
