post:
  tags:
    - Stats
  summary: Bulk check which items the current user has saved
  description: |
    Authenticated membership check used to hydrate per-user "saved" state on
    pages the CDN cache cannot personalize. Returns only the requested items
    that the user currently saves, grouped by bookmarkable_type — absent type
    keys mean none of the requested ids of that type are saved. Max 100 items
    per request; duplicate type/id pairs are rejected. Bookmarkable types:
    `map`, `blog_post`, `masterclass`, `podcast_episode`, `media_asset`,
    `consultation` (morph map).
  operationId: bookmarksCheck
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - items
          properties:
            items:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required:
                  - bookmarkable_type
                  - bookmarkable_id
                properties:
                  bookmarkable_type:
                    type: string
                    enum: [map, blog_post, masterclass, podcast_episode, media_asset, consultation]
                  bookmarkable_id:
                    type: integer
                    format: int64
  responses:
    '200':
      description: Saved membership for the requested items (unsaved/unknown ids are omitted)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  saved:
                    type: object
                    description: bookmarkable_type -> array of saved bookmarkable_ids among the requested items. Types with no saved items are omitted.
                    additionalProperties:
                      type: array
                      items:
                        type: integer
                        format: int64
    '401':
      description: Unauthenticated
    '403':
      description: Email not verified / banned
    '422':
      description: Invalid items payload (size, duplicates, unknown type)
