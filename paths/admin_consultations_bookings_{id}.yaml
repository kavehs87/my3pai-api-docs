get:
  tags:
    - Admin
  summary: Get consultation booking detail
  description: Get detailed consultation booking information including customer, influencer, consultation, computed amounts, and timeline (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Consultation booking detail
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/AdminConsultationBookingDetail.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Booking not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
