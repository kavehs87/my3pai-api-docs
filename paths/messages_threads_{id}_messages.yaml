post:
  tags:
    - Messages
  summary: Reply in a DM thread (idempotent)
  description: >
    Either participant may reply — the creator answers from the upgraded
    contact-messages panel through this same endpoint. The client generates
    `idempotency_key` per send action: repeating a key returns the original
    message with 200, never a duplicate (safe under retries and double-tap).
    A key already used for another message is 422. New activity un-hides an
    archived thread for both sides, and the recipient gets a bell
    notification (database; email/push off in Phase 1). Daily message cap
    429s when exceeded.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - body
            - idempotency_key
          properties:
            body:
              type: string
              minLength: 2
              maxLength: 5000
            idempotency_key:
              type: string
              maxLength: 64
              description: Client-generated unique key per send action (UUID recommended).
  responses:
    '201':
      description: Message sent.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  message:
                    $ref: ../components/schemas/ThreadMessage.yaml
    '200':
      description: Idempotent repeat — the original message, no duplicate created.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  message:
                    $ref: ../components/schemas/ThreadMessage.yaml
    '401':
      description: Unauthenticated.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Unknown id or not a participant — identical body either way.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error (body length, or key reuse across messages).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '429':
      description: Daily message cap exceeded, or 30/min write throttle.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
