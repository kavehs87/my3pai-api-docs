get:
  tags:
    - Influencers
    - Consultations
  summary: Get consultation bookings stats
  description: Dashboard badge — counts of pending bookings for the authenticated influencer. Must be registered before /bookings/{id} or it will be captured by the id route.
  responses:
    '200':
      description: Consultation bookings stats
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  pending:
                    type: integer
                    description: Total pending bookings (status=pending)
                  pending_paid:
                    type: integer
                    description: Pending with payment_status=paid (actionable todo)
                  pending_unpaid:
                    type: integer
                    description: Pending with payment_status=pending (awaiting payment)
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
