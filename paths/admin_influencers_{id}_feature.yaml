post:
  tags:
    - Admin
  summary: Toggle influencer featured status
  description: Set or unset the featured flag on an influencer's settings.
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - featured
          properties:
            featured:
              type: boolean
              description: Whether the influencer should be featured
  responses:
    '200':
      description: Featured status updated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  influencer:
                    $ref: ../components/schemas/AdminInfluencer.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Influencer not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
