post:
  tags:
    - Maps
    - Media
  summary: Upload map thumbnail
  description: Upload thumbnail image for map. Owner-only.
  parameters:
    - name: map
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - thumbnail
          properties:
            thumbnail:
              type: string
              format: binary
              description: Image file (jpeg, jpg, png, webp, max 10MB)
  responses:
    '200':
      description: Thumbnail uploaded successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  map:
                    $ref: ../components/schemas/MapResource.yaml
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
delete:
  tags:
    - Maps
    - Media
  summary: Delete map thumbnail
  description: Remove the existing thumbnail image for a map. Owner-only.
  parameters:
    - name: map
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Thumbnail removed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  map:
                    $ref: ../components/schemas/MapResource.yaml
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Map not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
