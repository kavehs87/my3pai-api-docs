patch:
  tags:
    - Admin
  summary: Change admin password
  description: Change the currently authenticated admin's password. Requires the current password for verification.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - current_password
            - password
            - password_confirmation
          properties:
            current_password:
              type: string
            password:
              type: string
              minLength: 8
              description: 'Must contain uppercase, lowercase, number, special character. Common passwords rejected.'
            password_confirmation:
              type: string
  responses:
    '200':
      description: Password changed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
                example: Password changed successfully
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed or current password incorrect
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
