get:
  tags:
    - Public
    - Blog
  summary: Get public blog posts for an influencer
  description: Get paginated list of published blog posts for an influencer
  security: []
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
    - name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    - name: per_page
      in: query
      schema:
        type: integer
        default: 10
        maximum: 50
        minimum: 1
  responses:
    '200':
      description: List of blog posts
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/BlogPostPublic.yaml
              meta:
                $ref: ../components/schemas/PaginationMeta.yaml
    '404':
      description: Influencer not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
