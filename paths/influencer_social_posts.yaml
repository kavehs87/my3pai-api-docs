get:
  tags:
    - Influencers
  summary: Get social posts (dashboard)
  description: Get all social posts for authenticated user (includes drafts)
  parameters:
    - name: type
      in: query
      schema:
        type: string
        enum:
          - youtube
          - short-form
          - all
        default: all
        description: Filter by type
    - name: platform
      in: query
      schema:
        type: string
        enum:
          - YouTube
          - Instagram
          - TikTok
          - Facebook
          - YouTube Shorts
        description: Filter by platform (for short-form)
    - name: status
      in: query
      schema:
        type: string
        enum:
          - published
          - draft
          - all
        default: all
        description: Filter by status
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    '200':
      description: List of social posts
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  youtube_videos:
                    type: array
                    items:
                      $ref: ../components/schemas/SocialPost.yaml
                  short_form_content:
                    type: array
                    items:
                      $ref: ../components/schemas/SocialPost.yaml
                  meta:
                    $ref: ../components/schemas/PaginationMeta.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
post:
  tags:
    - Influencers
  summary: Create social post
  description: Create a new social post
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - type
            - platform
            - thumbnail
            - url
          properties:
            type:
              type: string
              enum:
                - youtube
                - short-form
            platform:
              type: string
              enum:
                - YouTube
                - Instagram
                - TikTok
                - Facebook
                - YouTube Shorts
            title:
              type: string
              maxLength: 255
              description: Required for YouTube videos
            caption:
              type: string
              maxLength: 2000
              description: Recommended for short-form content
            thumbnail:
              type: string
              format: uri
              maxLength: 500
            url:
              type: string
              format: uri
              maxLength: 500
            views:
              type: string
              maxLength: 50
              description: Display string like "125K"
            duration:
              type: string
              maxLength: 20
              description: For videos, e.g., "14:20"
            status:
              type: string
              enum:
                - published
                - draft
              default: draft
            published_at:
              type: string
              format: date-time
              description: Optional, defaults to now if published
            order:
              type: integer
              minimum: 0
              default: 0
  responses:
    '201':
      description: Social post created
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/SocialPost.yaml
              message:
                type: string
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
