get:
  tags:
    - Influencers
    - Media Assets
  summary: Get own media assets
  description: Get current user's media assets (includes inactive/draft)
  parameters:
    - name: type
      in: query
      schema:
        type: string
        description: Comma-separated types (Video,Photo,Preset,Audio,Template,Other)
    - name: status
      in: query
      schema:
        type: string
        description: Comma-separated statuses (active,draft)
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    '200':
      description: List of media assets
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../components/schemas/MediaAsset.yaml
                  meta:
                    $ref: ../components/schemas/PaginationMeta.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
post:
  tags:
    - Influencers
    - Media Assets
  summary: Create media asset
  description: Create a new media asset
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MediaAssetCreate.yaml
  responses:
    '201':
      description: Media asset created
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/MediaAsset.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
