get:
  tags:
    - Feedback
  summary: List ratings on an item
  description: |
    Public, paginated, newest-first. Hidden/soft-deleted ratings excluded.
    Draft/unpublished items and globally killed sections 404; an
    influencer-disabled section returns an empty 200 page.
    Rateable types: `map`, `blog_post`, `masterclass`, `podcast_episode`,
    `media_asset`, `consultation` (consultations accept ratings only from
    customers with a recent completed booking).
  operationId: listItemRatings
  parameters:
    - name: type
      in: path
      required: true
      schema:
        type: string
        enum: [map, blog_post, masterclass, podcast_episode, media_asset, consultation]
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 15
        maximum: 50
  responses:
    '200':
      description: Paginated ratings
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/Rating.yaml
              meta:
                type: object
                properties:
                  current_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
    '404':
      description: Content not found (missing, draft, or disabled)
    '422':
      description: Invalid type
post:
  tags:
    - Feedback
  summary: Create or replace your rating (upsert)
  description: |
    Authenticated (email-verified, non-banned) writers only. Exactly one
    scorecard per user per item: re-posting replaces the previous rating
    (200 instead of 201, counters adjusted by delta, "Edited" flag set).
    Star-only ratings allowed (body nullable, min 10 when present).
    `is_verified_purchase` is derived server-side (ever-paid semantics;
    never true on free items). Consultations require a completed booking
    within the last 30 days.
  operationId: upsertItemRating
  parameters:
    - name: type
      in: path
      required: true
      schema:
        type: string
        enum: [map, blog_post, masterclass, podcast_episode, media_asset, consultation]
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - rating
          properties:
            rating:
              type: integer
              minimum: 1
              maximum: 5
            title:
              type: string
              maxLength: 120
              nullable: true
            body:
              type: string
              minLength: 10
              maxLength: 2000
              nullable: true
            website:
              type: string
              description: Honeypot — must stay empty.
  responses:
    '201':
      description: Rating created
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  rating:
                    type: integer
                  is_verified_purchase:
                    type: boolean
                  ratings_count:
                    type: integer
                  rating_avg:
                    type: number
                    format: float
                    nullable: true
    '200':
      description: Rating replaced (same shape as 201)
    '401':
      description: Unauthenticated
    '403':
      description: Email not verified / banned
    '404':
      description: Content not found (missing, draft, or disabled)
    '422':
      description: Self-rating, missing consultation booking, or validation failure
    '429':
      description: Rate limited
