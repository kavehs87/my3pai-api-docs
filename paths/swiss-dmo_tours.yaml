get:
  tags:
    - Swiss DMO
  summary: List tours
  description: |
    List Swiss DMO tours with search, classification, distance, ascent, and
    accessibility filtering. Returns compact list items with route metadata
    (SM route, distance, duration, ascent/descent).
  parameters:
    - name: q
      in: query
      schema:
        type: string
        maxLength: 200
      description: Search by name or abstract
    - name: classifications
      in: query
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
      description: Filter by classification value IDs
    - name: season
      in: query
      schema:
        type: string
        maxLength: 50
      description: Filter by recommended season
    - name: distanceMin
      in: query
      schema:
        type: number
        minimum: 0
      description: Minimum distance in kilometers
    - name: distanceMax
      in: query
      schema:
        type: number
        minimum: 0
      description: Maximum distance in kilometers
    - name: ascentMin
      in: query
      schema:
        type: integer
        minimum: 0
      description: Minimum ascent in meters
    - name: ascentMax
      in: query
      schema:
        type: integer
        minimum: 0
      description: Maximum ascent in meters
    - name: isBarrierFree
      in: query
      schema:
        type: boolean
      description: Filter by barrier-free accessibility
    - name: sort
      in: query
      schema:
        type: string
        enum: [name, cached_at, latitude, longitude, distance_km, ascent_m]
        default: name
    - name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    - name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
  responses:
    '200':
      description: Paginated tours
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: ../components/schemas/SwissDmoTourList.yaml
              meta:
                $ref: ../components/schemas/SwissDmoPaginationMeta.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
