get:
  tags:
    - Feedback
  summary: Pending testimonials on your profile (creator queue)
  description: Authenticated creator only; oldest first for review.
  operationId: pendingTestimonials
  parameters:
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 15
        maximum: 50
  responses:
    '200':
      description: Paginated pending testimonials
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/Testimonial.yaml
              meta:
                type: object
                properties:
                  current_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
    '401':
      description: Unauthenticated
    '403':
      description: Not verified / banned
