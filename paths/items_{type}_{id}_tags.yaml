put:
  tags:
    - Stats
  summary: Replace a product's tags (creator only)
  description: |
    Authenticated creator action (creator-tools gate). Full replacement of the
    calling creator's own product tags: the given keys become the complete
    set (absent keys are detached, an empty array clears all tags). Unknown
    keys are created as custom tags owned by the creator. Keys are trimmed
    verbatim; max 20 per item. Address items with the same `{type}/{id}`
    vocabulary as comments/ratings (`map`, `blog_post`, `masterclass`,
    `podcast_episode`, `media_asset`, `consultation`). Marketplace caches are
    bumped so search and display refresh.
  operationId: itemsTagsUpdate
  parameters:
    - name: type
      in: path
      required: true
      schema:
        type: string
        enum: [map, blog_post, masterclass, podcast_episode, media_asset, consultation]
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - tags
          properties:
            tags:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 64
  responses:
    '200':
      description: Tags replaced (sorted)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: string
    '401':
      description: Unauthenticated
    '403':
      description: Email not verified / banned, not the owner, or creator tools disabled
    '404':
      description: Unknown type or content not found
    '422':
      description: Invalid tags payload (missing key, oversized)
