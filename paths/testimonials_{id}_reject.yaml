post:
  tags:
    - Feedback
  summary: Reject a testimonial (creator)
  description: Profile owner only, pending testimonials only. Silent (no notification).
  operationId: rejectTestimonial
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Rejected
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Testimonial.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Not the profile owner / not verified / banned
    '404':
      description: Testimonial not found
    '422':
      description: Not pending
