get:
  tags:
    - Admin Payments
  summary: Get payment detail
  description: Get full payment details with fee breakdown, refunds, and Stripe IDs (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Payment detail
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/AdminPaymentDetail.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Payment not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
