get:
  tags:
    - Influencers
    - Masterclasses
  summary: Get own masterclasses (includes drafts)
  description: Get all masterclasses for authenticated user, including unpublished drafts. Supports pagination with `page` and `per_page` query parameters (max 50 per page).
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
      description: Page number
    - in: query
      name: per_page
      schema:
        type: integer
        default: 10
        maximum: 50
      description: Items per page (max 50)
  responses:
    '200':
      description: List of masterclasses
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/MasterclassFull.yaml
              meta:
                $ref: ../components/schemas/PaginationMeta.yaml
post:
  tags:
    - Influencers
    - Masterclasses
  summary: Create masterclass
  description: Create a new masterclass
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MasterclassCreate.yaml
  responses:
    '201':
      description: Masterclass created
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/MasterclassFull.yaml
              message:
                type: string
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
