get:
  tags:
    - Influencers
    - Masterclasses
  summary: Get own masterclasses (includes drafts)
  description: Get all masterclasses for authenticated user, including unpublished drafts
  responses:
    '200':
      description: List of masterclasses
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/MasterclassFull.yaml
post:
  tags:
    - Influencers
    - Masterclasses
  summary: Create masterclass
  description: Create a new masterclass
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MasterclassCreate.yaml
  responses:
    '201':
      description: Masterclass created
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/MasterclassFull.yaml
              message:
                type: string
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
