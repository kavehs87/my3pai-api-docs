get:
  tags:
    - Admin
  summary: List maps
  description: Get paginated list of maps with optional filters (admin only)
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
        minimum: 1
    - name: search
      in: query
      schema:
        type: string
        maxLength: 255
    - name: status
      in: query
      schema:
        type: string
        enum:
          - published
          - draft
          - "0"
          - "1"
          - "true"
          - "false"
    - name: is_for_sale
      in: query
      schema:
        type: boolean
    - name: creator_id
      in: query
      schema:
        type: integer
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: sort
      in: query
      schema:
        type: string
        enum:
          - title
          - created_at
          - updated_at
        default: created_at
    - name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
  responses:
    '200':
      description: Paginated list of maps
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  maps:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminMap.yaml
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
