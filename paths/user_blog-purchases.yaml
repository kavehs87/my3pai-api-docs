get:
  tags:
    - Blog
  summary: Get my purchased blog posts
  description: Get all premium blog posts purchased by the current user
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
        maximum: 50
    - name: page
      in: query
      schema:
        type: integer
        default: 1
  responses:
    '200':
      description: List of purchases
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/BlogPostPurchase.yaml
              meta:
                $ref: ../components/schemas/PaginationMeta.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
