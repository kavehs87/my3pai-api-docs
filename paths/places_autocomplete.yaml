get:
  tags:
    - Unified Places
  summary: Autocomplete search
  description: |
    Search for places by name with optional category and country filters.
    Replaces Google Places Autocomplete. Returns predictions in a shape
    compatible with Google Places AutocompletePrediction.

    **Rate limit:** 300 requests/minute
  parameters:
    - name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 500
      description: Search query (fulltext search against place names)
    - name: unified_category
      in: query
      schema:
        type: string
        maxLength: 200
      description: Filter by unified category slug (e.g., `attractions`, `food_drink`)
    - name: country
      in: query
      schema:
        type: string
        maxLength: 10
      description: Filter by ISO 3166-1 alpha-2 country code (e.g., `CH`, `DE`)
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
      description: Maximum number of predictions to return
    - name: lat
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: |
        Soft location-bias latitude (map center). Must be sent together with `lon`
        (422 otherwise). Named entities still win globally (e.g. "Eiffel Tower").
    - name: lon
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Soft location-bias longitude. Must be sent together with `lat` (422 otherwise).
    - name: bias_radius_km
      in: query
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 500
      description: |
        "Search this area" tier radius in km. When present, results inside the
        radius rank first and global results fill below. Accepted (ignored) when
        `lat`/`lon` are absent, matching the upstream service.
  responses:
    '200':
      description: Autocomplete predictions
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  predictions:
                    type: array
                    items:
                      $ref: ../components/schemas/UnifiedPlacePrediction.yaml
                  total:
                    type: integer
                    description: Total matching results
                  has_more:
                    type: boolean
                    description: Whether more results are available
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '503':
      description: Unified place service unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Service unavailable
