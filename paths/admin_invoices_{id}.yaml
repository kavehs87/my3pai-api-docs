get:
  tags:
    - Admin
  summary: Get invoice detail
  description: Get full invoice details with line items, timeline, and payment info (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Invoice detail
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/AdminInvoiceDetail.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Invoice not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
