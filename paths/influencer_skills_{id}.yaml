put:
  tags:
    - Influencers
  summary: Update skill
  description: Update an existing skill
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            skill:
              type: string
              maxLength: 255
            sortOrder:
              type: integer
              minimum: 0
              nullable: true
  responses:
    '200':
      description: Skill updated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/UserSkill.yaml
              message:
                type: string
    '404':
      description: Skill not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
delete:
  tags:
    - Influencers
  summary: Delete skill
  description: Delete a skill
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Skill deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
    '404':
      description: Skill not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
