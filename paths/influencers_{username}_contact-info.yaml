get:
  summary: Get public contact information
  description: Retrieve public contact information for an influencer by username
  tags:
    - Public
  parameters:
    - name: username
      in: path
      required: true
      description: The influencer's username
      schema:
        type: string
        example: "johndoe"
  responses:
    '200':
      description: Public contact information retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '../components/schemas/ContactSettings.yaml'
    '404':
      description: Influencer not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ErrorResponse.yaml'

