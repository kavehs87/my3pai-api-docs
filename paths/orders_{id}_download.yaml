get:
  tags:
    - Billing
  summary: Download order confirmation PDF
  description: >
    Generates a secure, time-limited download link for the order confirmation PDF.
    The response is a redirect (302) to the PDF file in storage.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Signed PDF download URL
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    example: https://storage.googleapis.com/...
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not owner (buyer or seller)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Order not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '500':
      description: Server error during PDF generation or signing
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml

