post:
  tags:
    - Billing
  summary: Process refund for order
  description: |
    Admin-only endpoint to process a full or partial refund for an order.

    - Omit `amount_cents` to refund the full remaining refundable amount.
    - Send `amount_cents` to refund a specific amount in cents.
    - Repeated partial refunds are allowed as long as their total does not exceed the order total.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - reason
          properties:
            reason:
              type: string
              enum:
                - requested_by_customer
                - duplicate
                - fraudulent
                - other
            reason_description:
              type: string
              nullable: true
            amount_cents:
              type: integer
              minimum: 1
              description: Optional partial refund amount in cents. When omitted, the full remaining amount is refunded.
  responses:
    '200':
      description: Refund processed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  refund_id:
                    type: integer
                  amount_refunded_cents:
                    type: integer
                    minimum: 0
                    description: Refunded amount in cents.
                  status:
                    type: string
                    enum: [pending, succeeded]
    '400':
      description: Order cannot be refunded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed (invalid `amount_cents` or amount exceeds remaining refundable amount)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Only administrators are authorized to refund orders
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Order not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
