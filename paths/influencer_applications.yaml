get:
  tags:
    - Influencers
  summary: List own influencer application history
  description: |
    Paginated history of the caller's influencer applications (latest first). Each entry preserves message/documents/status.
    Re-applies create new rows (Option B audit trail), never overwriting rejected history.
  security:
    - BearerAuth: []
  parameters:
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    '200':
      description: History
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: ../components/schemas/InfluencerApplication.yaml
                  meta:
                    $ref: ../components/schemas/PaginationMeta.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
