post:
  tags:
    - Authentication
  summary: Resend verification email
  description: |
    Resend the email verification link to a user who has not yet verified their email.
    
    The verification token expires after 60 minutes by default.

    **Enumeration-safe:** unknown, already-verified, and pending emails all
    receive the same generic success response, so the endpoint cannot be used
    to enumerate registered addresses.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ResendVerificationRequest.yaml
        examples:
          default:
            value:
              email: jane@example.com
  responses:
    '200':
      description: >
        Always returned when the email passes basic validation, regardless of
        whether the address is registered, already verified, or pending. The
        response body is intentionally uniform to prevent email enumeration.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: If that email address is registered and unverified, a verification email has been sent.
    '422':
      description: Validation failed (missing or malformed email)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '429':
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
