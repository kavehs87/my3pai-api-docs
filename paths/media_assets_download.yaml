get:
  tags:
    - Media Assets
  summary: Download purchased media asset file
  description: |
    Entitlement-gated download for a purchased media asset. The endpoint re-validates
    authentication, ownership, payment state, refund state and the download window on every
    request, then 302-redirects to a short-lived (15 minute) signed S3 URL for the immutable
    purchase snapshot (or the original source file). This is the single enforced download gate —
    no long-lived or token-based download links are ever exposed.

    Legacy anonymous token links (`?token=...&expires=...&path=...`) are rejected with `410`.
  security:
    - BearerAuth: []
  parameters:
    - name: purchase
      in: query
      required: true
      description: The media asset purchase ID
      schema:
        type: integer
  responses:
    '302':
      description: Redirect to a short-lived signed download URL
      headers:
        Location:
          description: Short-lived signed S3 URL for the file
          schema:
            type: string
            format: uri
    '400':
      description: Invalid or missing purchase parameter
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Purchase does not belong to the user, or payment is pending/failed/refunded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Purchase not found or file not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '410':
      description: Legacy token link, or download window has expired
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
