post:
  tags:
    - Influencers
    - Blog
  summary: Feature/unfeature blog post (creator)
  description: |
    Profile owner only (same ownership rule as PUT). Toggle endpoint that pins
    a published blog post to the creator's public profile home; at most 4
    featured per creator (fifth feature is rejected with 422). Unfeaturing is
    always allowed. Only published posts can be featured (drafts → 422).
  operationId: featureBlogPost
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Toggled
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/BlogPostFull.yaml
              message:
                type: string
    '401':
      description: Unauthenticated
    '403':
      description: Not the profile owner
    '404':
      description: Blog post not found
    '422':
      description: Post is a draft, or the 4-featured cap is reached
