post:
  tags:
    - Admin
  summary: Publish masterclass
  description: Publish a masterclass by setting is_published to true (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Masterclass published successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  masterclass:
                    $ref: ../components/schemas/AdminMasterclass.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Masterclass not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
