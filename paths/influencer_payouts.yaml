get:
  tags:
    - Influencers
    - Billing
  summary: List influencer payouts
  description: Get paginated list of payouts for the authenticated influencer
  security:
    - BearerAuth: []
  parameters:
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - pending
          - processing
          - paid
          - failed
      description: Filter by status (comma-separated for multiple)
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
      description: Number of items per page
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number
  responses:
    '200':
      description: Payouts list
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        amount_cents:
                          type: integer
                          description: Amount in cents
                        currency:
                          type: string
                        status:
                          type: string
                          enum:
                            - pending
                            - processing
                            - paid
                            - failed
                        created_at:
                          type: string
                          format: date-time
                        processed_at:
                          type: string
                          format: date-time
                          nullable: true
                        paid_at:
                          type: string
                          format: date-time
                          nullable: true
                        stripe_transfer_id:
                          type: string
                          nullable: true
                        metadata:
                          type: object
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
