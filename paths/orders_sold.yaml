get:
  tags:
    - Billing
  summary: List sold orders
  description: |
    List orders where the current user is the influencer/seller (sold orders).
    Supports filtering by status, payment status, date range, and search.
  security:
    - BearerAuth: []
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
        maximum: 100
      description: Number of orders per page (maximum 100)
    - name: status
      in: query
      schema:
        type: string
        enum:
          - pending
          - processing
          - completed
          - cancelled
          - refunded
          - partially_refunded
      description: Filter by order status (comma-separated for multiple values)
    - name: payment_status
      in: query
      schema:
        type: string
        enum:
          - pending
          - processing
          - paid
          - failed
          - refunded
          - partially_refunded
      description: Filter by payment status (comma-separated for multiple values)
    - name: from_date
      in: query
      schema:
        type: string
        format: date
      description: Filter orders created on or after this date (YYYY-MM-DD)
    - name: to_date
      in: query
      schema:
        type: string
        format: date
      description: Filter orders created on or before this date (YYYY-MM-DD)
    - name: search
      in: query
      schema:
        type: string
      description: Search by order number, billing name, or billing email
  responses:
    '200':
      description: Sold orders retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/Order.yaml
              meta:
                $ref: ../components/schemas/PaginationMeta.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
