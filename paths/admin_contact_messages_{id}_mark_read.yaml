post:
  tags:
    - Admin
  summary: Mark contact message as read
  description: Mark a contact message as read (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Message marked as read
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
                example: "Message marked as read"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Contact message not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
