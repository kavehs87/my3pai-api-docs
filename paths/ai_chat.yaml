post:
  tags:
    - AI
  summary: Chat with Vertex AI Gemini
  description: >
    Send a message to Google Vertex AI Gemini model and receive a generated text response.
    Uses the gemini-1.5-flash-001 model (or configured model) via Vertex AI API.
    
    **Authentication:**
    Requires valid Sanctum authentication token.
    
    **Rate Limiting:**
    Subject to standard API rate limiting.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: The user's message/prompt to send to the AI model
              maxLength: 10000
              example: "What are the best travel destinations in Europe?"
  responses:
    '200':
      description: AI response generated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  message:
                    type: string
                    description: The generated text response from the AI model
                    example: "Europe offers a diverse range of incredible travel destinations..."
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation failed
              errors:
                type: object
                properties:
                  message:
                    type: array
                    items:
                      type: string
                    example:
                      - "The message field is required."
    '500':
      description: Server error or Vertex AI API error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Failed to generate response
              error:
                type: string
                description: Error message (only shown in local/development environments)
                example: "Vertex AI API error: Invalid credentials"

