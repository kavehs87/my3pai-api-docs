get:
  tags:
    - Billing
  summary: List purchased digital products
  description: Retrieve the authenticated user's purchased digital assets with delivery metadata.
  responses:
    '200':
      description: Purchased products list
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: ../components/schemas/MediaAssetPurchase.yaml
                        - $ref: ../components/schemas/MapPurchase.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml

