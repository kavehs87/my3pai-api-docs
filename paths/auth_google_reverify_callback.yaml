get:
  tags:
    - Authentication
  summary: Handle Google OAuth re-verification callback
  description: |
    Handles the Google OAuth callback for account deletion re-verification.
    Verifies the user's Google identity matches the authenticated user, then stores
    a short-lived cache flag (5min TTL) and redirects back to the frontend with ?reverify=success.
  responses:
    '302':
      description: >
        Redirect to frontend. On success, redirects with ?reverify=success.
        On failure (invalid token, missing google_id, email mismatch, or exception),
        redirects with ?reverify=error.
