post:
  tags:
    - Profile
  summary: Change password
  description: Change user password
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ChangePasswordRequest.yaml
  responses:
    '200':
      description: Password changed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
    '400':
      description: Current password is incorrect
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed (new password same as current, or other validation errors)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
