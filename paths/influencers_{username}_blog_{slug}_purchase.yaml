post:
  tags:
    - Blog
  summary: Purchase blog post
  description: >
    Customer purchases a premium blog post via Stripe Checkout Session.
    Optional `return_url` / `cancel_url` body fields replace the default
    website success/cancel URLs (website or PWA origin only, else 422).
    Free posts (price_cents = 0) purchase without a creator Stripe account
    and without a checkout session.
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
    - name: slug
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            return_url:
              type: string
              format: uri
              maxLength: 2000
              description: Optional Stripe success_url override (website or PWA origin only; else 422).
            cancel_url:
              type: string
              format: uri
              maxLength: 2000
              description: Optional Stripe cancel_url override (website or PWA origin only; else 422).
  responses:
    '201':
      description: >
        For a paid post, the checkout session is created. For a free post
        (price_cents = 0), the purchase completes with no payment step.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                description: Paid post — checkout session created
                properties:
                  success:
                    type: boolean
                  redirect_url:
                    type: string
                    format: uri
                  order_id:
                    type: integer
                  order_number:
                    type: string
                  checkout_session_id:
                    type: string
              - type: object
                description: Free post — purchase completed, no payment step
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      purchase:
                        $ref: ../components/schemas/BlogPostPurchase.yaml
                      paymentIntent:
                        type: 'null'
                        description: Always null for free posts — no payment step
                  order_id:
                    type: integer
                  order_number:
                    type: string
                  message:
                    type: string
    '400':
      description: >
        Cannot purchase (not published, not premium, no price, self-purchase,
        already purchased, influencer Stripe not ready). Readiness refusals
        carry the machine-readable `code` `CREATOR_PAYMENT_NOT_READY`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Blog post not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '500':
      description: Failed to create order or checkout session
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
