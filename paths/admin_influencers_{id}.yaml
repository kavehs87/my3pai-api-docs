get:
  tags:
    - Admin
  summary: Get influencer detail
  description: Get full influencer profile with stripe account, earnings, content counts, consultation stats, settings, and social links
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Influencer detail
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  influencer:
                    $ref: ../components/schemas/AdminInfluencerDetail.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Influencer not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
