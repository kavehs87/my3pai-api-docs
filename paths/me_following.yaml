get:
  tags:
    - Stats
  summary: List creators the current user follows
  description: |
    Authenticated, personal, **never CDN-cached** (`Cache-Control: private,
    no-store`). Creators the current user follows, most-recently-followed
    first, with opaque cursor pagination (base64 JSON of follow timestamp +
    row id). Cards use the exact `MarketplaceCreator` shape of
    `GET /marketplace/creators` (bulk per-type counts, travelers guided).
    Anonymized accounts are excluded.
  operationId: meFollowing
  parameters:
    - name: cursor
      in: query
      description: Opaque cursor from previous page's `meta.next_cursor`
      schema:
        type: string
        maxLength: 2000
    - name: limit
      in: query
      description: Page size (1..50, default 20)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    '200':
      description: Paginated followed creators
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/MarketplaceCreator.yaml
              meta:
                type: object
                properties:
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for next page; null when has_more=false
                  has_more:
                    type: boolean
                  total:
                    type: integer
                    description: Followed rows
                  limit:
                    type: integer
    '401':
      description: Unauthenticated
    '403':
      description: Email not verified / banned
    '422':
      description: Invalid cursor or limit
