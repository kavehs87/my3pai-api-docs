get:
  tags:
    - Admin
  summary: Get recent activity
  description: Get recent activity logs (admin only)
  responses:
    '200':
      description: Activity logs
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
