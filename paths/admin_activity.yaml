get:
  tags:
    - Admin
  summary: Get recent activity
  description: Get recent activity feed for the admin dashboard (admin only)
  parameters:
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      description: Items per page (capped at 50)
    - name: admin_id
      in: query
      required: false
      schema:
        type: integer
      description: Filter by acting admin user ID
    - name: action
      in: query
      required: false
      schema:
        type: string
      description: Filter by action type (e.g. created, updated, deleted, refunded)
    - name: entity_type
      in: query
      required: false
      schema:
        type: string
      description: Filter by entity type (e.g. user, order, map, blog_post)
    - name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
      description: Case-insensitive substring match against description, type and subject_type
    - name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Activity from date (inclusive)
    - name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Activity up to date (inclusive)
  responses:
    '200':
      description: Activity feed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminActivityItem.yaml
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of activities
                      per_page:
                        type: integer
                        description: Items per page
                      has_more:
                        type: boolean
                        description: Whether there are more activities beyond this page
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
