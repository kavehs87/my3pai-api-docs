get:
  tags:
    - Admin
  summary: Get recent activity
  description: Get recent activity feed for the admin dashboard (admin only)
  parameters:
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      description: Items per page (capped at 50)
  responses:
    '200':
      description: Activity feed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminActivityItem.yaml
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of activities
                      per_page:
                        type: integer
                        description: Items per page
                      has_more:
                        type: boolean
                        description: Whether there are more activities beyond this page
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
