get:
  tags:
    - Billing
  summary: Get invoice details
  description: >-
    Get detailed information about a specific invoice. User must be either the
    customer or the influencer.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Invoice retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Invoice.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Invoice not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
