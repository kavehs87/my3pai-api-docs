post:
  tags:
    - Media Assets
  summary: Purchase media asset
  description: |
    Creates (or resumes) a purchase for a media asset and returns a Stripe PaymentIntent
    client secret. No download URL is generated before payment: the customer completes
    checkout with the client secret, and the `downloadUrl` only becomes available on the
    purchase once the PaymentIntent has succeeded (via webhook or `POST /payments/confirm`).

    Idempotent per customer + asset:
    - If a purchase is already paid and its download window is active, returns `400`.
    - If a pending purchase has an actionable PaymentIntent, returns `200` with the same
      client secret to resume.
    - If the pending purchase's PaymentIntent has already succeeded, finalizes it and returns
      `200` with the now-available download URL.

    Free assets (`paymentIntent.amount === 0`): the purchase is finalized immediately on the
    server - do NOT call `stripe.confirmCardPayment` with the client secret; the download is
    already available.
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Existing purchase resumed (pending PaymentIntent) or finalized (PaymentIntent already succeeded)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  purchase:
                    $ref: ../components/schemas/MediaAssetPurchase.yaml
                  paymentIntent:
                    type: object
                    properties:
                      clientSecret:
                        type: string
                      amount:
                        type: integer
                      currency:
                        type: string
              message:
                type: string
    '201':
      description: Purchase created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  purchase:
                    $ref: ../components/schemas/MediaAssetPurchase.yaml
                  paymentIntent:
                    type: object
                    properties:
                      clientSecret:
                        type: string
                      amount:
                        type: integer
                      currency:
                        type: string
              message:
                type: string
    '400':
      description: Cannot purchase own asset, asset not available, asset has no file, or asset already purchased (active download window)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Asset not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '500':
      description: Payment processing failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
