post:
  tags:
    - Authentication
  summary: Request password reset
  description: |
    Send a password reset link to the user's email address.
    
    **Security Note:** This endpoint always returns success to prevent email enumeration attacks.
    If the email exists in the system, a password reset link will be sent.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ForgotPasswordRequest.yaml
        examples:
          default:
            value:
              email: user@example.com
  responses:
    '200':
      description: Password reset link sent (if email exists)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: If that email address exists in our system, we have sent a password reset link.
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '429':
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml

