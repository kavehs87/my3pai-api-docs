get:
  tags:
    - Admin
  summary: Get user activity log
  description: Show all admin actions and system events involving a specific user (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    - name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    '200':
      description: Activity log for user
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: [admin_action, order_placed, order_refunded]
                        description:
                          type: string
                        subject_type:
                          type: string
                        subject_id:
                          type: integer
                        performed_by:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        created_at:
                          type: string
                          format: date-time
                        created_at_human:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      per_page:
                        type: integer
                      has_more:
                        type: boolean
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: User not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
