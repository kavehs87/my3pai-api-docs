post:
  tags:
    - DZT
  summary: Search nearby tourism POIs via SPARQL
  description: |
    Search the DZT (Open Data Germany) Knowledge Graph for tourism entities
    within a radius of given coordinates using a single SPARQL query.

    Returns all available fields inline: name, description, coordinates, address,
    phone, website, opening hours, pricing, booking links, and license info.
    Results are filtered by Haversine distance and sorted by distance ascending.

    When `fastMode` is `true`, only essential fields are fetched (id, name, type,
    coordinates, distance) — enrichment fields return `null`. Use for quick
    nearby POI discovery where full details aren't needed.

    Any authenticated user can call this endpoint — no POI ownership required.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SearchDztNearbySparqlRequest.yaml
  responses:
    '200':
      description: Nearby POIs sorted by distance
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: ../components/schemas/PoiDztNearbyResult.yaml
                  total:
                    type: integer
                    description: Number of results within radius
                  boundingBox:
                    type: object
                    description: Bounding box used for SPARQL geo filter
                    properties:
                      minLat:
                        type: number
                      maxLat:
                        type: number
                      minLon:
                        type: number
                      maxLon:
                        type: number
                  centerLat:
                    type: number
                    description: Center latitude of search
                  centerLon:
                    type: number
                    description: Center longitude of search
                  radiusKm:
                    type: integer
                    description: Search radius in kilometers
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '500':
      description: DZT SPARQL API error or configuration missing
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
