post:
  tags:
    - Webhooks
  summary: Handle video worker callbacks
  description: >
    Webhook endpoint for Cloud Run Job video worker callbacks. Receives processing results
    after video processing completes (watermark, optimization, thumbnail generation).

    **Security:** HMAC-SHA256 signature verification required via `X-Video-Webhook-Signature` header.
    Signature is computed as: `HMAC-SHA256(raw_json_payload, secret)` where secret is shared
    between the Cloud Run Job and Laravel API.

    Accepts two payload formats:
    - **Format A (Python worker):** `video_id`, `status` (processed|failed), `video_gcs_uri`, `thumb_gcs_uri`, `error`
    - **Format B (debug):** `video_id`, `status` (success|failed|processing), `output_paths`, `error_message`

    On success, updates user record with video URL, thumbnail URL, and status='ready'.
    On failure, updates user status to 'failed'. All callbacks are stored for audit trail.
  security: []
  parameters:
    - name: X-Video-Webhook-Signature
      in: header
      required: true
      description: HMAC-SHA256 signature of the request body. Computed as `HMAC-SHA256(raw_json_payload, secret)` and sent as hex digest.
      schema:
        type: string
        example: "a1b2c3d4e5f6..."
      example: "a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: ../components/schemas/VideoWorkerCallbackFormatA.yaml
            - $ref: ../components/schemas/VideoWorkerCallbackFormatB.yaml
        examples:
          formatA:
            summary: Format A (Python worker)
            value:
              video_id: 123
              status: processed
              video_gcs_uri: gs://my3pai-public-assets/intro-videos/123/video.mp4
              thumb_gcs_uri: gs://my3pai-public-assets/intro-videos/123/thumbnail.jpg
              error: null
          formatB:
            summary: Format B (debug)
            value:
              video_id: "123"
              status: success
              output_paths:
                - gs://my3pai-public-assets/intro-videos/123/video.mp4
                - gs://my3pai-public-assets/intro-videos/123/thumbnail.jpg
              error_message: null
  responses:
    '200':
      description: Callback received and processed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Callback received and processed
    '401':
      description: Invalid or missing HMAC signature
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Invalid signature
    '404':
      description: User not found (returns 200 in production to avoid retries)
    '422':
      description: Invalid payload structure
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml

