get:
  tags:
    - Admin
  summary: List influencers
  description: Get paginated list of influencers (users with influencer_settings) with content counts, revenue, and Stripe info
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
    - name: search
      in: query
      schema:
        type: string
    - name: stripe_status
      in: query
      schema:
        type: string
        enum: [active, restricted, pending, none]
    - name: verified
      in: query
      schema:
        type: boolean
    - name: has_content
      in: query
      schema:
        type: boolean
    - name: sort
      in: query
      schema:
        type: string
        enum: [created_at, name, email]
    - name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
  responses:
    '200':
      description: Paginated list of influencers
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  influencers:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminInfluencer.yaml
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
