get:
  tags:
    - Stats
  summary: Influencer per-item stats
  description: |
    Per-item aggregates for the authenticated influencer. `type` enumerates
    all six purchasable types — the four beaconed types expose
    `views`/`visitors`/`likes`/`sales`/`revenue_cents`; `consultation` rows
    expose sales/revenue only; `media_asset` rows expose
    `likes`/`downloads`/`sales`/`revenue_cents`. Visitors are
    HLL-approximate (≈). Sorted in-memory; `limit` ≤ 100.
  operationId: influencerStatsItems
  parameters:
    - name: type
      in: query
      schema:
        type: string
        enum: [map, blog_post, masterclass, podcast_episode, consultation, media_asset]
    - name: sort
      in: query
      schema:
        type: string
        enum: [views, visitors, likes, conversion, revenue, sales]
        default: views
    - name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: free_paid
      in: query
      schema:
        type: string
        enum: [all, free, paid]
        default: all
    - name: period
      in: query
      schema:
        type: string
        enum: ['7d', '30d', '90d', all]
        default: 30d
  responses:
    '200':
      description: Item stats
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/ItemStats.yaml
              approximate:
                type: object
                properties:
                  visitors:
                    type: boolean
    '401':
      description: Unauthenticated
    '403':
      description: Not an influencer (or creator tools disabled)
