get:
  tags:
    - Admin
  summary: List invoices
  description: Get paginated list of invoices with optional filters (admin only)
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
    - name: status
      in: query
      schema:
        type: string
        enum: [paid, unpaid, overdue, cancelled]
    - name: perspective
      in: query
      schema:
        type: string
        enum: [sent, received]
    - name: user_id
      in: query
      schema:
        type: integer
    - name: influencer_id
      in: query
      schema:
        type: integer
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: search
      in: query
      schema:
        type: string
    - name: sort
      in: query
      schema:
        type: string
        enum: [invoice_number, total_amount_cents, status, due_at, created_at]
        default: created_at
    - name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  responses:
    '200':
      description: Paginated list of invoices
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminInvoice.yaml
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
