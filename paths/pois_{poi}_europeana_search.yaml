post:
  tags:
    - POIs
    - Europeana
  summary: Search Europeana API
  description: |
    Proxy search to the Europeana API. Keeps the Europeana API key server-side.
    Requires authentication and ownership of the POI.

    Results include normalized rights and access type information derived from
    the edm:rights field.
  parameters:
    - name: poi
      in: path
      required: true
      schema:
        type: integer
      description: The POI ID (used for auth context)
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SearchEuropeanaRequest.yaml
  responses:
    '200':
      description: Search results from Europeana
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: ../components/schemas/PoiEuropeanaSearchResult.yaml
                  total:
                    type: integer
                    description: Total number of results on Europeana
                  page:
                    type: integer
                  pageSize:
                    type: integer
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '500':
      description: Europeana API error or configuration missing
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
