post:
  tags:
    - Admin
  summary: Admin forgot password
  description: Send a password reset link to an admin email. Always returns 200 to prevent email enumeration.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
  responses:
    '200':
      description: Reset link sent (or ignored if email not found)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
                example: If an admin account with that email exists, a password reset link has been sent.
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
