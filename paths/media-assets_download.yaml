get:
  tags:
    - Media Assets
  summary: Download media asset file
  description: Download purchased media asset using signed URL
  security: []
  parameters:
    - name: token
      in: query
      required: true
      schema:
        type: string
    - name: expires
      in: query
      required: true
      schema:
        type: integer
    - name: path
      in: query
      required: true
      schema:
        type: string
  responses:
    '200':
      description: File download
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      description: Invalid download link
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: File not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '410':
      description: Download link expired
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
