post:
  tags:
    - Billing
  summary: Create order from cart
  description: >
    Create an order from the current user's active shopping cart.


    **Authentication Required**: User must be authenticated.


    **Cart Requirements:**

    - User must have an active cart with at least one item

    - Cart items are automatically converted to order items

    - Cart is marked as "converted" after order creation


    **Free Orders:**

    - If cart total = $0 (all items are free), the order is automatically
    completed

    - Billing information is optional for free orders (user's email/name will be
    used if not provided)

    - Payment intent is not created for free orders

    - Invoice is automatically generated and marked as paid

    - Response includes `is_free: true` flag


    **Paid Orders:**

    - Billing information is required for paid orders

    - Payment intent must be created separately via `/api/payments/intent` (also usable as pay-later for any pending order)

    - Response includes `is_free: false` flag


    **De-duplication (pay-later):**

    - If the caller already has a `status=pending` + `payment_status=pending` order
      containing the exact same set of `item_type`+`item_id` pairs (order-insensitive),
      no new order is created — the existing pending order is returned (cart is still
      marked `converted`) so the frontend can mint a fresh Checkout Session for it
      via `/api/payments/intent`. Guest checkout (no user) is not de-duplicated.


    **Billing Information:**

    - Supports both flat and nested billing address structures

    - Flat structure: `billing_address_line1`, `billing_address_line2`,
    `billing_city`, etc.

    - Nested structure: `billing_address.line1`, `billing_address.line2`, etc.

    - **For free orders**: All billing fields are optional

    - **For paid orders**: Billing email and complete address are required
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/StoreOrderRequest.yaml
  responses:
    '201':
      description: Order created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: ../components/schemas/Order.yaml
              message:
                type: string
                example: Order created successfully
              is_free:
                type: boolean
                description: True if order total is $0 (free order)
                example: false
    '400':
      description: Bad request (e.g., empty cart)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Cart is empty. Please add items to your cart before checkout.
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '500':
      description: Server error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Failed to create order. Please try again.
get:
  tags:
    - Billing
  summary: List orders
  description: >-
    List user's orders (both purchased and sold). Supports filtering and
    pagination.
  security:
    - BearerAuth: []
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
    - name: status
      in: query
      schema:
        type: string
        enum:
          - pending
          - processing
          - completed
          - cancelled
          - refunded
          - partially_refunded
    - name: payment_status
      in: query
      schema:
        type: string
        enum:
          - pending
          - processing
          - paid
          - failed
          - refunded
          - partially_refunded
    - name: type
      in: query
      schema:
        type: string
        enum:
          - purchased
          - sold
        description: >-
          Filter by order type (purchased = user is customer, sold = user is
          influencer)
    - name: from_date
      in: query
      schema:
        type: string
        format: date
    - name: to_date
      in: query
      schema:
        type: string
        format: date
  responses:
    '200':
      description: Orders retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/Order.yaml
              meta:
                $ref: ../components/schemas/PaginationMeta.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
