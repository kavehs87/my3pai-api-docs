post:
  tags:
    - Authentication
  summary: Reset password with token
  description: |
    Reset the user's password using the token received via email.
    
    After successful password reset, all existing authentication tokens are revoked
    and the user must log in again with the new password.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ResetPasswordRequest.yaml
        examples:
          default:
            value:
              email: user@example.com
              token: abc123def456ghi789
              password: newSecurePassword123
              password_confirmation: newSecurePassword123
  responses:
    '200':
      description: Password reset successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Password reset successfully
    '422':
      description: Validation failed or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Password reset failed
              errors:
                type: object
                properties:
                  email:
                    type: array
                    items:
                      type: string
                    example:
                      - The password reset token is invalid.
    '429':
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml

