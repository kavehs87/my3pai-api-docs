get:
  tags:
    - Consultations
  summary: Get single booking
  description: Get detailed booking information (accessible by customer or influencer)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Booking details
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/ConsultationBooking.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Booking not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
