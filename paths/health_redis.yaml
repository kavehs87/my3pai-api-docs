get:
  tags:
    - Public
  summary: Health check — Redis
  description: Returns the health status of the Redis connection
  security: []
  responses:
    '200':
      description: Redis is reachable
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
    '503':
      description: Redis is unreachable
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
