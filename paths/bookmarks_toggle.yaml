post:
  tags:
    - Stats
  summary: Toggle a bookmark (save) on content
  description: |
    Authenticated consumer action (email-verified accounts only — spam gate).
    1 bookmark per user per item, idempotent toggle; DELETE is implicit in the
    second call. Self-save is rejected with 422. Only visible content can be
    saved (unpublished/draft items and inactive media assets/consultations
    404). Saved state is personal — the response carries no counter.
    Bookmarkable types: `map`, `blog_post`, `masterclass`, `podcast_episode`,
    `media_asset`, `consultation` (morph map).
  operationId: bookmarksToggle
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - bookmarkable_type
            - bookmarkable_id
          properties:
            bookmarkable_type:
              type: string
              enum: [map, blog_post, masterclass, podcast_episode, media_asset, consultation]
            bookmarkable_id:
              type: integer
              format: int64
  responses:
    '200':
      description: Toggled
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Bookmark.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Email not verified / banned
    '404':
      description: Content not found
    '422':
      description: Self-save or invalid type
