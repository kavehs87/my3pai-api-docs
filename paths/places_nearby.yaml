get:
  tags:
    - Unified Places
  summary: Nearby places
  description: |
    Search for places within a radius of a coordinate point.
    Replaces Google Places NearbySearch. Results include distance from
    the query point and support cursor-based pagination.

    **Rate limit:** 120 requests/minute
  parameters:
    - name: lat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: Latitude of the search center
    - name: lon
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Longitude of the search center
    - name: radius_km
      in: query
      schema:
        type: number
        minimum: 0
        maximum: 50
        default: 0.1
      description: Search radius in kilometers
    - name: unified_category
      in: query
      schema:
        type: string
        maxLength: 200
      description: Filter by unified category slug
    - name: excluded_categories
      in: query
      schema:
        type: array
        items:
          type: string
          maxLength: 200
      description: >
        Category slugs to exclude from results.
        Server fetches extra results to compensate for filtering.
      style: form
      explode: true
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of entities to return
    - name: cursor
      in: query
      schema:
        type: string
        maxLength: 500
      description: Cursor for pagination (from `pagination.next_cursor`)
  responses:
    '200':
      description: Nearby places
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      $ref: ../components/schemas/UnifiedPlaceEntity.yaml
                  total:
                    type: integer
                    description: Total matching results
                  pagination:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                      has_more:
                        type: boolean
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '503':
      description: Unified place service unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Service unavailable
