get:
  tags:
    - Consultations
  summary: Get my bookings (customer)
  description: Get all consultation bookings for current user (as customer)
  parameters:
    - name: status
      in: query
      schema:
        type: string
        description: Comma-separated statuses (pending,confirmed,completed,cancelled)
  responses:
    '200':
      description: List of bookings
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  upcoming:
                    type: array
                    items:
                      $ref: ../components/schemas/ConsultationBooking.yaml
                  past:
                    type: array
                    items:
                      $ref: ../components/schemas/ConsultationBooking.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
