post:
  tags:
    - Consultations
  summary: Book a consultation and process payment
  description: >
    Book a consultation slot and create a Stripe Checkout Session in one step. 

    This endpoint creates an order, checkout session, and booking record.
    
    The frontend should redirect the user to the `redirect_url` to complete payment on Stripe's hosted checkout page.
    
    After successful payment, Stripe will redirect back to `{FRONTEND_URL}/checkout/success?session_id={CHECKOUT_SESSION_ID}&order_id={ORDER_ID}`.
    
    If the user cancels, Stripe will redirect to `{FRONTEND_URL}/checkout/cancel?order_id={ORDER_ID}`.


    The endpoint automatically checks for time slot conflicts:

    - Prevents overlapping bookings (considers consultation duration)

    - Only checks pending and confirmed bookings (ignores cancelled/completed)

    - Returns HTTP 409 if the requested time slot overlaps with an existing
    booking


    Use the availability endpoints to check available slots before booking.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      description: Consultation ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BookAndPayRequest.yaml
  responses:
    '201':
      description: Booking and checkout session created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              redirect_url:
                type: string
                format: uri
                description: Stripe Checkout Session URL - redirect user to this URL to complete payment
              order_id:
                type: integer
                description: Order ID
              order_number:
                type: string
                description: Order number
              booking_id:
                type: integer
                description: Booking ID
              checkout_session_id:
                type: string
                description: Stripe Checkout Session ID
    '400':
      description: Cannot book own consultation or influencer not set up
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Consultation not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '409':
      description: Time slot already booked
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '500':
      description: Failed to create booking and process payment
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
