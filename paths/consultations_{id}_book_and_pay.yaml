post:
  tags:
    - Consultations
  summary: Book a consultation and process payment
  description: >
    Book a consultation slot and create a Stripe Checkout Session in one step. 

    This endpoint creates an order, checkout session, and booking record.
    
    The frontend should redirect the user to the `redirect_url` to complete payment on Stripe's hosted checkout page.
    
    After successful payment, Stripe will redirect back to `{FRONTEND_URL}/checkout/success?session_id={CHECKOUT_SESSION_ID}&order_id={ORDER_ID}`.
    
    If the user cancels, Stripe will redirect to `{FRONTEND_URL}/checkout/cancel?order_id={ORDER_ID}`.


    The endpoint automatically checks for time slot conflicts:

    - Prevents overlapping bookings (considers consultation duration)

    - Only checks pending and confirmed bookings (ignores cancelled/completed)

    - Returns HTTP 409 if the requested time slot overlaps with an existing
    booking


    Use the availability endpoints to check available slots before booking.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      description: Consultation ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BookAndPayRequest.yaml
  responses:
    '201':
      description: >
        For a paid consultation, the booking and checkout session are created
        successfully. For a free consultation (consultation.price_cents = 0),
        the booking is confirmed without a checkout session.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                description: Paid consultation — checkout session created
                properties:
                  success:
                    type: boolean
                  redirect_url:
                    type: string
                    format: uri
                    description: Stripe Checkout Session URL - redirect user to this URL to complete payment
                  order_id:
                    type: integer
                    description: Order ID
                  order_number:
                    type: string
                    description: Order number
                  booking_id:
                    type: integer
                    description: Booking ID
                  checkout_session_id:
                    type: string
                    description: Stripe Checkout Session ID
              - type: object
                description: Free consultation — booking confirmed, no payment step
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      booking:
                        $ref: ../components/schemas/ConsultationBooking.yaml
                      paymentIntent:
                        type: 'null'
                        description: Always null for free consultations — no payment step
                      order_id:
                        type: integer
                        description: Order ID
                      order_number:
                        type: string
                        description: Order number
                  message:
                    type: string
    '400':
      description: Cannot book own consultation or malformed input
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Consultation not found, not active, or hidden from the public profile
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '409':
      description: Time slot already booked
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: >
        Validation error. A paid consultation from a payment-unready creator is
        refused with error code `CREATOR_PAYMENT_NOT_READY` for every unready
        state (Stripe account not connected, not active, or restricted) — the
        refusal happens before any booking/order row is written. Free
        consultations (consultation.price_cents = 0) are never refused here.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ValidationError.yaml
              - type: object
                properties:
                  code:
                    type: string
                    example: CREATOR_PAYMENT_NOT_READY
    '500':
      description: Failed to create booking and process payment
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
