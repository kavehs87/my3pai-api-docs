post:
  tags:
    - Public
    - Influencers
  summary: Submit contact form to influencer
  description: Public endpoint to send a contact message to an influencer
  security: []
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
      description: Influencer's username
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - subject
            - message
          properties:
            name:
              type: string
              maxLength: 255
              example: "John Doe"
            email:
              type: string
              format: email
              maxLength: 255
              example: "john@example.com"
            subject:
              type: string
              enum: [general, course, business, press]
              example: "general"
            message:
              type: string
              minLength: 10
              maxLength: 5000
              example: "Hello, I have a question about your courses..."
            website:
              type: string
              maxLength: 0
              nullable: true
              description: >
                Honeypot spam prevention field. Frontend should render this as a hidden input
                with CSS `display: none`. Bots that fill this field will cause a 422 validation error.
                Leave empty or omit for legitimate submissions.
  responses:
    '201':
      description: Contact message sent successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
                example: "Your message has been sent successfully"
              data:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  subject:
                    type: string
                  created_at:
                    type: string
                    format: date-time
    '404':
      description: Influencer not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '429':
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
