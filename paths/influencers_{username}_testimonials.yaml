get:
  tags:
    - Feedback
  summary: List approved testimonials on a creator profile
  description: |
    Public. Approved testimonials only, featured first, then newest.
    10 per page max 50.
  operationId: listTestimonials
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 10
        maximum: 50
  responses:
    '200':
      description: Paginated testimonials
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/Testimonial.yaml
              meta:
                type: object
                properties:
                  current_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
    '404':
      description: Influencer not found (or section disabled)
post:
  tags:
    - Feedback
  summary: Submit a testimonial (pending approval)
  description: |
    Authenticated (email-verified, non-banned) writers only. Self-endorsement
    is rejected (422). Max 1 pending testimonial per author per creator (422
    while one awaits review). Body plain text (min 2, max 2000, max 2 links,
    honeypot `website`).
  operationId: storeTestimonial
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - body
          properties:
            body:
              type: string
              minLength: 2
              maxLength: 2000
            website:
              type: string
              description: Honeypot — must stay empty.
  responses:
    '201':
      description: Created (pending)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Testimonial.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Not verified / banned
    '404':
      description: Influencer not found (or section disabled)
    '422':
      description: Self-endorsement, pending cap, or validation failure
    '429':
      description: Rate limited
