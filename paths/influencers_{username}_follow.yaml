post:
  tags:
    - Public
    - Influencers
  summary: Follow or unfollow a creator
  description: |
    Authenticated consumer action (email-verified accounts only — spam gate).
    1 follow per user per creator, idempotent toggle; a second call removes
    the follow. Self-follow is rejected with 422. Unknown usernames 404.
    The toggle busts the creator's cached overview profile so the fresh
    `followers_count` is served immediately.
  operationId: influencersFollowToggle
  security:
    - BearerAuth: []
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Toggled
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/FollowToggle.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Email not verified / banned
    '404':
      description: Influencer not found
    '422':
      description: Self-follow
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '429':
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
