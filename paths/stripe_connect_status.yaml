get:
  tags:
    - Stripe
  summary: Get Stripe Connect account status
  description: Get the status of the connected Stripe account
  responses:
    '200':
      description: Account status
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  connected:
                    type: boolean
                  accountId:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - pending
                      - active
                      - restricted
                      - disabled
                    nullable: true
                  chargesEnabled:
                    type: boolean
                  payoutsEnabled:
                    type: boolean
                  requiresAction:
                    type: boolean
                    description: True if user needs to complete more onboarding steps
                  requirements:
                    type: object
                    nullable: true
                    properties:
                      currentlyDue:
                        type: array
                        items:
                          type: string
                      eventuallyDue:
                        type: array
                        items:
                          type: string
    '500':
      description: Stripe API error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
