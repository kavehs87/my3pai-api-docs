post:
  tags:
    - Billing
  summary: Confirm payment
  description: |
    Confirm payment after Stripe Payment Intent succeeds. This endpoint:
    - Resolves the order from the payment intent (read-only) and verifies
      order ownership BEFORE any payment side effects run
    - Validates the payment intent with Stripe
    - Creates payment, invoice, and earnings records
    - Updates order status to paid

    **Ownership / probing:** unknown payment intents, intents with no
    order (direct media-asset purchases), and intents for orders that do
    not belong to the caller all return the same 404. Responses are not
    distinguishable, so they cannot be used to probe order existence.

    **Free Orders:**
    - This endpoint should NOT be called for free orders (total = $0)
    - Free orders are automatically completed during order creation
    - If called with a free order, will return 400 error

    The `order_id` parameter is optional but recommended for validation.
    If provided, it will be verified to match the payment intent's order.
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - payment_intent_id
          properties:
            payment_intent_id:
              type: string
              description: Stripe PaymentIntent ID
              example: pi_3SacXJ9RXVZMuOrk1mo8KoC1
            order_id:
              type: integer
              description: >-
                Optional order ID for validation. If provided, must match the
                payment intent's order. Free orders will be rejected.
              example: 13
  responses:
    '200':
      description: Payment confirmed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  order:
                    $ref: ../components/schemas/Order.yaml
                  payment:
                    $ref: ../components/schemas/Payment.yaml
    '400':
      description: >-
        Payment confirmation failed (invalid payment intent, order mismatch,
        free order, or validation error)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                description: Error message describing what went wrong
          examples:
            orderMismatch:
              value:
                success: false
                error: Order ID does not match the payment intent order.
            freeOrder:
              value:
                success: false
                error: Payment confirmation is not required for free orders.
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Unauthenticated
    '404':
      description: >-
        Payment intent not found, has no associated order, or the order does
        not belong to the authenticated user. All three cases return the same
        response on purpose — ownership is verified before any fulfilment and
        responses must not be distinguishable. Also returned for direct
        media-asset purchase intents (no order — finalized by the
        webhook/resume flow; re-fetch the purchase list to see the state).
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Payment intent not found or does not belong to you.
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                description: Error message (detailed in debug mode, generic in production)
                example: An error occurred while confirming payment. Please try again.
