put:
  tags:
    - Influencers
    - Podcast
  summary: Update podcast settings
  description: Update the custom title and description for the podcast section in themes
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            podcastTitle:
              type: string
              nullable: true
              maxLength: 255
              description: Custom title for the podcast section in themes
              example: "My Travel Podcast"
            podcastDescription:
              type: string
              nullable: true
              maxLength: 1000
              description: Description of the podcast section
              example: "Weekly episodes covering solo travel safety, budgeting, and creator tips."
            applePodcastUrl:
              type: string
              nullable: true
              format: uri
              maxLength: 500
              description: Apple Podcast URL
              example: "https://podcasts.apple.com/us/podcast/my-travel-podcast/id123456789"
            spotifyUrl:
              type: string
              nullable: true
              format: uri
              maxLength: 500
              description: Spotify URL
              example: "https://open.spotify.com/show/1234567890abcdef"
  responses:
    '200':
      description: Podcast settings updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  podcastTitle:
                    type: string
                    nullable: true
                    description: Updated podcast title
                  podcastDescription:
                    type: string
                    nullable: true
                    description: Updated podcast description
                  applePodcastUrl:
                    type: string
                    nullable: true
                    format: uri
                    description: Updated Apple Podcast URL
                  spotifyUrl:
                    type: string
                    nullable: true
                    format: uri
                    description: Updated Spotify URL
              message:
                type: string
                example: "Podcast settings updated successfully"
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml

