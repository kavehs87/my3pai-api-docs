post:
  tags:
    - Authentication
  summary: Verify email address
  description: |
    Verify a user's email address using the token from the verification email.
    
    The frontend receives the verification link with `email` and `token` query parameters,
    then calls this endpoint to complete verification. On success, the user receives
    an authentication token and a welcome notification.

    **Enumeration-safe:** unknown emails and invalid tokens produce the exact same
    400 response (no user-existence oracle). Re-verifying an already-verified
    account with a still-valid token succeeds idempotently.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/VerifyEmailRequest.yaml
        examples:
          default:
            value:
              email: jane@example.com
              token: eyJ0b2tlbiI6IjEyMzQ1Njc4OTAiLCJlbWFpbCI6Imp...
  responses:
    '200':
      description: Email verified successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthResponse.yaml
    '400':
      description: >
        Invalid or expired verification token. Also returned for unknown emails —
        the response is intentionally identical so the endpoint cannot be used
        to enumerate registered addresses.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '429':
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
