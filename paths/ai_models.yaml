get:
  tags:
    - AI
  summary: List supported AI models
  description: >
    Returns the currently configured AI provider (selected via AI_PROVIDER:
    `openrouter`, `ionos`, or `opencode-go`) and model, plus the list of
    model options supported by the active provider. Non-OpenRouter
    providers retry once against OpenRouter on transport/5xx/429
    failures (see `configured.fallback`). Use this endpoint to discover
    which models are available for use with the chat endpoint.

    This endpoint is public and does not require authentication.
  security: []
  responses:
    '200':
      description: Models list retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  configured:
                    type: object
                    properties:
                      provider:
                        type: string
                        enum: [openrouter, ionos, opencode-go]
                        example: openrouter
                      fallback:
                        type: string
                        enum: [openrouter]
                        description: Present when the active provider retries against OpenRouter on transport/5xx/429 failures (ionos, opencode-go only).
                      model:
                        type: string
                        example: openrouter/free
                      base_url:
                        type: string
                        example: https://openrouter.ai/api/v1
                      openrouter_provider:
                        type: string
                        description: OpenRouter provider routing (openrouter only; absent on ionos).
                      openrouter_provider_order:
                        type: array
                        items:
                          type: string
                        description: Normalized provider order (openrouter only; absent on ionos).
                      openrouter_provider_config:
                        type: object
                        description: Provider routing payload sent to OpenRouter (openrouter only; absent on ionos).
                      reasoning:
                        type: object
                        description: Global reasoning config (openrouter only; absent on ionos).
                      reasoning_effort:
                        type: string
                        enum: [low, medium, high]
                        description: Global reasoning effort (ionos only; absent on openrouter).
                  supported:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
    '500':
      description: Server error or AI provider API error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Failed to retrieve models
