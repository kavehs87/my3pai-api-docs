get:
  tags:
    - AI
  summary: List supported AI models
  description: >
    Returns the currently configured AI model (via OpenRouter) and a list of
    model options supported by the application. Use this endpoint to discover
    which models are available for use with the chat endpoint.

    This endpoint is public and does not require authentication.
  security: []
  responses:
    '200':
      description: Models list retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  configured:
                    type: object
                    properties:
                      provider:
                        type: string
                        example: openrouter
                      model:
                        type: string
                        example: openrouter/free
                      base_url:
                        type: string
                        example: https://openrouter.ai/api/v1
                  supported:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
    '500':
      description: Server error or OpenRouter API error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Failed to retrieve models
