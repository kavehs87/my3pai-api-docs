patch:
  tags:
    - Notifications
  summary: Mark notification as read
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Notification marked as read
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: ../components/schemas/Notification.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Notification not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
