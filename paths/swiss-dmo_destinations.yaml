get:
  tags:
    - Swiss DMO
  summary: List destinations
  description: |
    List Swiss DMO destinations with search, classification filtering, and
    pagination. Returns compact list items with coordinates, thumbnail, and
    classification data.
  parameters:
    - name: q
      in: query
      schema:
        type: string
        maxLength: 200
      description: Search by name or abstract
    - name: classifications
      in: query
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
      description: Filter by classification value IDs
    - name: sort
      in: query
      schema:
        type: string
        enum: [name, cached_at, latitude, longitude]
        default: name
    - name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    - name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
  responses:
    '200':
      description: Paginated destinations
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: ../components/schemas/SwissDmoDestinationList.yaml
              meta:
                $ref: ../components/schemas/SwissDmoPaginationMeta.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
