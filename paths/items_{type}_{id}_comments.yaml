get:
  tags:
    - Feedback
  summary: List comments on an item
  description: |
    Public, paginated, newest-first, top-level only. Hidden/soft-deleted
    comments are excluded; counters match the visible list exactly.
    ?include_replies=1 attaches one level of visible replies (oldest first).
    Draft/unpublished items and globally killed sections 404; an
    influencer-disabled section returns an empty 200 page.
    Commentable types: `map`, `blog_post`, `masterclass`, `podcast_episode`,
    `media_asset`, `consultation`.
  operationId: listItemComments
  parameters:
    - name: type
      in: path
      required: true
      schema:
        type: string
        enum: [map, blog_post, masterclass, podcast_episode, media_asset, consultation]
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: include_replies
      in: query
      required: false
      schema:
        type: boolean
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 15
        maximum: 50
  responses:
    '200':
      description: Paginated comments
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/Comment.yaml
              meta:
                type: object
                properties:
                  current_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
    '404':
      description: Content not found (missing, draft, or disabled)
    '422':
      description: Invalid type
post:
  tags:
    - Feedback
  summary: Post a comment on an item
  description: |
    Authenticated (email-verified, non-banned) writers only; no guest writes.
    The item owner cannot start threads on their own item (422) but may reply
    once per thread. Per-user caps: 5/day per item + 60s cooldown (429).
    Body is plain text (min 2, max 1000, max 2 links, honeypot `website`).
    Replies reference a top-level comment of the SAME item (422 otherwise).
  operationId: storeItemComment
  parameters:
    - name: type
      in: path
      required: true
      schema:
        type: string
        enum: [map, blog_post, masterclass, podcast_episode, media_asset, consultation]
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - body
          properties:
            body:
              type: string
              minLength: 2
              maxLength: 1000
            parent_id:
              type: integer
              format: int64
              description: Top-level comment id on the same item.
            website:
              type: string
              description: Honeypot — must stay empty.
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Comment.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Email not verified / banned
    '404':
      description: Content not found (missing, draft, or disabled)
    '422':
      description: Self-comment, bad parent, or validation failure
    '429':
      description: Rate limited, daily cap, or cooldown
