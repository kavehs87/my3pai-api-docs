post:
  tags:
    - Stats
  summary: Bulk check which creators the current user follows
  description: |
    Authenticated membership check used to hydrate FollowButton state on
    creator pages and lists the CDN cache cannot personalize. Returns an
    explicit boolean per requested username — unknown usernames and
    not-followed creators read `false`. Max 100 usernames per request.
  operationId: influencersFollowCheck
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - usernames
          properties:
            usernames:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: string
                maxLength: 255
  responses:
    '200':
      description: Follow membership for the requested usernames
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  following:
                    type: object
                    description: username -> true when the current user follows that creator, false otherwise (including unknown usernames).
                    additionalProperties:
                      type: boolean
    '401':
      description: Unauthenticated
    '403':
      description: Email not verified / banned
    '422':
      description: Invalid usernames payload (size)
