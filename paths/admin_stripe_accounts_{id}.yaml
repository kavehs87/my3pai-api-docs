get:
  tags:
    - Admin
  summary: Get Stripe account detail
  description: Get detailed Stripe Connect account information for a user (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Stripe account detail
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/AdminStripeAccountDetail.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Stripe account not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
