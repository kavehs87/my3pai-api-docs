get:
  tags:
    - Admin
  summary: List orders
  description: Get paginated list of orders with optional filters (admin only)
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
    - name: status
      in: query
      schema:
        type: string
        enum: [pending, completed, refunded, cancelled, partially_refunded]
    - name: payment_status
      in: query
      schema:
        type: string
        enum: [paid, unpaid, refunded]
    - name: user_id
      in: query
      schema:
        type: integer
    - name: influencer_id
      in: query
      description: Return orders where this influencer is the seller (at least one order item belongs to this creator).
      schema:
        type: integer
    - name: item_type
      in: query
      schema:
        type: string
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: search
      in: query
      schema:
        type: string
  responses:
    '200':
      description: Paginated list of orders
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminOrder.yaml
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
