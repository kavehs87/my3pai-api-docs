post:
  tags:
    - Feedback
  summary: Report a comment
  description: |
    One report per user per content (422 on duplicate). Authors and item
    owners cannot report (owners use instant hide). At 5 distinct reporters
    the comment auto-hides pending admin review.
  operationId: reportComment
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - reason
          properties:
            reason:
              type: string
              enum: [spam, harassment, hate, sexual, pii, other]
            details:
              type: string
              maxLength: 500
              nullable: true
            website:
              type: string
              description: Honeypot — must stay empty.
  responses:
    '200':
      description: Reported
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  reported:
                    type: boolean
                  hidden:
                    type: boolean
                    description: True when this report crossed the auto-hide threshold.
    '401':
      description: Unauthenticated
    '403':
      description: Not verified / banned
    '404':
      description: Comment not found
    '422':
      description: Duplicate, self/owner report, or validation failure
