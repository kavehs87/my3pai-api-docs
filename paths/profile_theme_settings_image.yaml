post:
  tags:
    - Profile
  summary: Upload theme slot image
  description: |
    Host a theme image slot file on our CDN. JPEG/PNG/WebP, max 5MB,
    max 3840x2160px, max 20 images per creator. Returns a CDN URL that
    image slots accept (slots reject off-allowlist hosts).
  operationId: uploadThemeImage
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - image
          properties:
            image:
              type: string
              format: binary
              description: Image file (jpeg, jpg, png, webp, max 5MB, max 3840x2160)
  responses:
    '201':
      description: Image hosted
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
    '401':
      description: Unauthenticated
    '422':
      description: Validation failed (type, size, dimensions, or quota)
