delete:
  tags:
    - POIs
    - DZT
  summary: Detach a DZT item from a POI
  description: |
    Remove a previously attached DZT item from a POI.
    Uses soft delete — the record is not permanently removed.
    Requires authentication and ownership of the POI.
  parameters:
    - name: poi
      in: path
      required: true
      schema:
        type: integer
      description: The POI ID
    - name: dztItem
      in: path
      required: true
      schema:
        type: integer
      description: The DZT item ID
  responses:
    '200':
      description: DZT item detached successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: DZT item detached successfully.
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: POI or DZT item not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
