get:
  tags:
    - Authentication
  summary: Handle Google OAuth callback
  description: >
    Handles the Google OAuth callback after user authorization.
    Creates or updates the user account and redirects back to the frontend.
  security: []
  responses:
    '302':
      description: >
        Redirect to frontend. On success, redirects to the dashboard.
        On failure, redirects to the login page with an error query parameter.
