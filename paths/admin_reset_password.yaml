post:
  tags:
    - Admin
  summary: Admin reset password
  description: Reset admin password using a valid token from the forgot-password email. Revokes all existing tokens on success.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - token
            - email
            - password
            - password_confirmation
          properties:
            token:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
              description: 'Must contain uppercase, lowercase, number, special character. Common passwords rejected.'
            password_confirmation:
              type: string
  responses:
    '200':
      description: Password reset successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
                example: Password has been reset successfully.
    '422':
      description: Validation failed, invalid/expired token, or token belongs to non-admin user
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
