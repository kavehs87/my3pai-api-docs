get:
  tags:
    - Notifications
  summary: List notifications
  parameters:
    - name: category
      in: query
      required: false
      schema:
        type: string
        enum: [business, system]
    - name: severity
      in: query
      required: false
      schema:
        type: string
        enum: [info, success, warning, error]
    - name: read
      in: query
      required: false
      schema:
        type: string
        enum: ["0", "1"]
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    '200':
      description: Paginated list of notifications
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NotificationListResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
