put:
  tags:
    - Profile
  summary: Save per-theme profile customization
  description: |
    Validate settings against the theme schema and store the sanitized
    per-theme object (replaces that theme's settings; other themes kept).
    Unknown keys, over-length text, off-palette accents, and off-allowlist
    image hosts are 422 with per-field errors. Text renders escaped-only;
    images must be CDN-hosted (see the image endpoint). Payload cap ~30KB.
  operationId: updateThemeSettings
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - theme
            - settings
          properties:
            theme:
              type: string
              example: wanderluxe-v2
            settings:
              type: object
              description: Theme settings per the schema spec
              example:
                accent: '#c9a24b'
                hero:
                  title: My headline
                order: [hero, map, academy, journal, onair, cta]
                hidden: [onair]
  responses:
    '200':
      description: Stored sanitized settings
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  theme:
                    type: string
                  settings:
                    type: object
    '401':
      description: Unauthenticated
    '422':
      description: Validation failed (per-field errors)
