get:
  tags:
    - Admin Payments
  summary: List payments
  description: Get paginated list of all payments with optional filters (admin only)
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: status
      in: query
      schema:
        type: string
        enum: [succeeded, failed, refunded, pending]
    - name: method
      in: query
      schema:
        type: string
        enum: [stripe, bank_transfer, other]
    - name: user_id
      in: query
      schema:
        type: integer
    - name: influencer_id
      in: query
      schema:
        type: integer
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: sort
      in: query
      schema:
        type: string
        enum: [amount, status, created_at]
        default: created_at
    - name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  responses:
    '200':
      description: Paginated list of payments
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminPayment.yaml
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
