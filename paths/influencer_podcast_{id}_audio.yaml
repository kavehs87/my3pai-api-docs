post:
  tags:
    - Influencers
    - Podcast
    - Media
  summary: Upload audio file
  description: Upload an audio file for a podcast episode
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            audio:
              type: string
              format: binary
              description: Audio file (MP3, M4A, WAV, OGG, AAC, FLAC, WebM, max 500MB)
  responses:
    '200':
      description: Audio file uploaded
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  audioUrl:
                    type: string
                    format: uri
              message:
                type: string
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: You do not have permission to upload audio for this podcast episode
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
