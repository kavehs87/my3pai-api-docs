get:
  tags:
    - Swiss DMO
  summary: Map bounding box query
  description: |
    Get Swiss DMO resources within a bounding box for map view rendering.
    Returns DZT-compatible results with coordinates and license info.
    Results are limited globally across all resource types.
  parameters:
    - name: minLat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: Minimum latitude
    - name: maxLat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: Maximum latitude
    - name: minLon
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Minimum longitude
    - name: maxLon
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Maximum longitude
    - name: entityType
      in: query
      schema:
        type: string
        enum: [destination, attraction, tour]
      description: Filter by resource type
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
      description: Maximum number of results (applied globally)
  responses:
    '200':
      description: Resources within bounding box
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: ../components/schemas/SwissDmoMapResult.yaml
                  total:
                    type: integer
                    description: Total count before limit
                  boundingBox:
                    type: object
                    properties:
                      minLat:
                        type: number
                      maxLat:
                        type: number
                      minLon:
                        type: number
                      maxLon:
                        type: number
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
