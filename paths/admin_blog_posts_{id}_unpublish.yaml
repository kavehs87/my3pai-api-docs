post:
  tags:
    - Admin
  summary: Unpublish blog post
  description: Unpublish a blog post by setting is_published to false (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Blog post unpublished successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  blog_post:
                    $ref: ../components/schemas/AdminBlogPost.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Blog post not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
