get:
  tags:
    - Public
  summary: Get public social posts for an influencer
  description: Get published social posts for a specific influencer's profile
  security: []
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
    - name: type
      in: query
      schema:
        type: string
        enum:
          - youtube
          - short-form
          - all
        default: all
        description: Filter by type
    - name: platform
      in: query
      schema:
        type: string
        enum:
          - YouTube
          - Instagram
          - TikTok
          - Facebook
          - YouTube Shorts
        description: Filter by platform (for short-form)
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    '200':
      description: List of social posts
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  youtube_videos:
                    type: array
                    items:
                      $ref: ../components/schemas/SocialPost.yaml
                  short_form_content:
                    type: array
                    items:
                      $ref: ../components/schemas/SocialPost.yaml
                  meta:
                    $ref: ../components/schemas/PaginationMeta.yaml
    '404':
      description: Influencer not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
