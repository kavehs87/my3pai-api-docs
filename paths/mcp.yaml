post:
  tags:
    - MCP
  summary: Model Context Protocol endpoint (admin automation)
  description: >
    Streamable HTTP transport endpoint for the MCP (Model Context Protocol) admin server.
    Enables LLM agents (e.g. opencode) to perform admin operations: dashboard stats,
    user/influencer management, content moderation, billing reads, platform settings.

     Requires an admin Sanctum token with the `mcp-admin` ability (see
     `php artisan user:create-mcp-token`). All mutating operations are written to
     ActivityLog with action prefix `mcp:`.

     Influencer provisioning: `influencer_create` atomically creates a new
     user (role=influencer, verified by default) and their creator-settings
     row, so the influencer appears in the admin Influencers dashboard
     immediately without waiting for their first session in the public app;
     optional per-tool `*_enabled` toggles (maps, blog, podcast,
      masterclass, consultation, media_assets) default to true.

      Profile media: `user_set_avatar`, `user_set_cover` and `user_set_logo`
      accept `source_url` or `source_path` (exactly one), validate the real
      content, replace the previous file, and return the updated user
      (avatar is center-cropped to 256x256; logo also accepts SVG).
      `user_clear_avatar`, `user_clear_cover` and `user_clear_logo` are
      idempotent. `influencer_set_intro_thumbnail` sets the intro picture.
      `influencer_set_intro_video` accepts `video_url`, stores the master in
      the source bucket, sets `intro_video_status=processing`, and dispatches
      the async video worker; `influencer_clear_intro_video` removes the
      video, source/public artifacts, thumbnail, status and duration.
      `user_show` and `influencer_show` expose `avatar_url`, `logo_url`,
      `cover_image` and `intro_video`
      (`url`, `status`, `thumbnail_url`, `duration_seconds`).

      Blog tools: `blog_post_create` (creates a post for a chosen author;
      `author_id` + title required, content is sanitized as blog HTML, and
      premium posts require `price_cents > 0` plus an active author Stripe
      account) and `blog_post_set_cover` (`source_url` or `source_path`,
      exactly one; JPEG/PNG/WebP, 10 MB max, previous cover file deleted).

      Map & POI tools: `map_create` (creates a map record for a chosen creator:
     `creator_id` + title, price in cents, creator must have an active Stripe
     account when `is_for_sale`), `map_update` (title/slug, for-sale + price,
     publish toggle which cascades POI status like the public updateMap),
     `poi_create` (full POI payload mirroring the public POI create payload;
     the POI belongs to the map owner, created as draft; country accepts an
     ISO code or full country name; `isFeatured` honored with a max-2-per-map
     cap; POI money fields are decimal, not cents), `poi_update` (partial-
     merge semantics: absent = untouched, present = set, `null` clears
     nullable fields, `[]` clears relation arrays; `status`/`sort_order`/
     `draft_version` are never changed; optional `version` optimistic lock;
      `isFeatured` capped at 2 per map) and `poi_delete` (`confirm` guard;
      removes the POI's S3 media files first: images from the public bucket,
      videos + thumbnails from the source bucket).       Media tools:
      `poi_add_media` (adds media from public URLs — at least one of
      `urls` image batch (JPEG/PNG/WebP, 10 MB, max 20; a POI needs
      at least one image to become publishable), `video_urls` (MP4/MOV/
      WebM/MKV, 50 MB, max 10; stored in the source bucket and processed
      asynchronously, status `pending` until the worker finishes),
      `audio_url` (50 MB; replaces any existing audio) and `pdf_url`
      (20 MB; replaces any existing PDF); every file is validated before
      anything is written, so one bad URL rejects the whole call;
      optional `image_credit` sets the POI-wide credit) and
      `map_add_thumbnail` (sets the map thumbnail from a public image URL
      or a public-bucket S3 path — exactly one; the previous thumbnail
      file is deleted and the `?v=` cache-buster refreshes). Read-only POI
      helpers: `poi_reference_options` (reference vocabularies, allowed
      enum values and existing tag keys for authoring POI payloads),
      `poi_list` (per-map summary, no tips/media bodies) and `poi_show`
      (full public PoiResource shape).

    Protocol flow (per MCP spec):
    1. POST `initialize` -> response includes the `Mcp-Session-Id` header
    2. Subsequent requests send `Mcp-Session-Id` + `Mcp-Protocol-Version` headers
       with `tools/list`, `tools/call`, `ping`, etc.
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            jsonrpc:
              type: string
              enum: ['2.0']
            id:
              type: integer
            method:
              type: string
              description: MCP method (initialize, tools/list, tools/call, ping, ...)
            params:
              type: object
  responses:
    '200':
      description: JSON-RPC response (or SSE stream for GET)
      content:
        application/json:
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
              id:
                type: integer
                nullable: true
              result:
                type: object
                description: Successful result (e.g. tools list, tool call result)
              error:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
    '401':
      description: Unauthenticated
    '403':
      description: Forbidden (non-admin or unverified email)
    '405':
      description: Method not allowed (only POST is supported)
    '429':
      description: Too many requests
