post:
  tags:
    - Feedback
  summary: Hide a rating (item owner)
  description: |
    Only the owner of the underlying item. Hidden ratings leave the average
    and counters; the author is notified with a generic reason.
  operationId: hideRating
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Hidden
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/Rating.yaml
    '401':
      description: Unauthenticated
    '403':
      description: Not the item owner / not verified / banned
    '404':
      description: Rating not found
