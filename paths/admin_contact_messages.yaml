get:
  tags:
    - Admin
  summary: List contact messages
  description: Get paginated list of contact messages with optional filters (admin only)
  parameters:
    - name: per_page
      in: query
      schema:
        type: integer
        default: 15
        minimum: 1
    - name: search
      in: query
      schema:
        type: string
        maxLength: 255
    - name: subject
      in: query
      schema:
        type: string
        enum:
          - general
          - course
          - business
          - press
    - name: is_read
      in: query
      schema:
        type: string
        enum:
          - "true"
          - "false"
          - "0"
          - "1"
    - name: influencer_id
      in: query
      schema:
        type: integer
    - name: date_from
      in: query
      schema:
        type: string
        format: date
    - name: date_to
      in: query
      schema:
        type: string
        format: date
    - name: sort
      in: query
      schema:
        type: string
        enum:
          - created_at
          - name
          - email
          - subject
          - is_read
        default: created_at
    - name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
  responses:
    '200':
      description: Paginated list of contact messages
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: ../components/schemas/AdminContactMessage.yaml
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
