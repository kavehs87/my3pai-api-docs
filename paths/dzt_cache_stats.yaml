get:
  tags:
    - DZT
  summary: DZT cache statistics
  description: Returns count of cached POIs, breakdown by type, coverage regions, and bounding box. Public endpoint — no authentication required.
  operationId: getDztCacheStats
  security: []
  responses:
    '200':
      description: Cache statistics retrieved successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  totalCached:
                    type: integer
                    example: 1247
                  types:
                    type: object
                    additionalProperties:
                      type: integer
                    example:
                      tourist_attraction: 523
                      museum: 189
                      landmark: 142
                  regions:
                    type: array
                    items:
                      type: string
                    example:
                      - Berlin
                      - Bavaria
                      - Hamburg
                  boundingBox:
                    type: object
                    nullable: true
                    properties:
                      minLat:
                        type: number
                        example: 47.2
                      maxLat:
                        type: number
                        example: 54.8
                      minLon:
                        type: number
                        example: 6.0
                      maxLon:
                        type: number
                        example: 15.0
                  lastCachedAt:
                    type: string
                    format: date-time
                    nullable: true
                    example: '2026-06-07T15:30:00+00:00'
