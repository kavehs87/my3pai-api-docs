get:
  tags:
    - Admin
  summary: Download invoice PDF
  description: 302-redirect to a 15-minute signed URL for this environment's snapshot bucket (admin only). Never bounces at the raw stored URL. 409 PDF_BUCKET_MISMATCH when the stored URL points at another environment's bucket (regenerate first); 404 when the object is missing.
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '302':
      description: Redirect to PDF URL
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Invoice not found or PDF not available
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
