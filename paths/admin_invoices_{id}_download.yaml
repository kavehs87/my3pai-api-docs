get:
  tags:
    - Admin
  summary: Download invoice PDF
  description: Download the PDF file for an invoice (admin only)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '302':
      description: Redirect to PDF URL
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - not admin
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Invoice not found or PDF not available
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
