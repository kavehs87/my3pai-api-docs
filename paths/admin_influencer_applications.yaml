get:
  tags:
    - Admin
  summary: List influencer applications (admin)
  description: |
    Paginated list of influencer applications. Filter by status, search (name/email/username), user_id. Default all statuses, newest first.
    Used for the admin vetting queue. `pending` count powers the sidebar badge.
  security:
    - BearerAuth: []
  parameters:
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [pending, approved, rejected, withdrawn]
    - name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
    - name: user_id
      in: query
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
  responses:
    '200':
      description: Paginated applications
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: ../components/schemas/InfluencerApplication.yaml
                  meta:
                    $ref: ../components/schemas/PaginationMeta.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '403':
      description: Forbidden - admin only
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
