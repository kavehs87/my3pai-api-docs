post:
  tags:
    - WebSocket
  summary: Authorize private channel subscription
  description: >
    Called automatically by Laravel Echo (pusher-js) when the client attempts
    to subscribe to a private channel. The request sends `socket_id` +
    `channel_name` (`application/x-www-form-urlencoded`); the server
    authenticates the requester — Bearer token or stateful session cookie —
    and returns the Pusher channel authorization (`auth` signature).

    The route runs on the `api` group with `auth:sanctum` (registered via an
    explicit `withBroadcasting()` call, not the `web`-group default, which
    resolved no user and 403'd everything). Only two private channels exist:
    `private-App.Models.User.{id}` (your own notifications and
    video-processing events) and `private-map.{mapId}` (owner-only live map
    drafts). Subscribing to anyone else's channel 403s, as does any unmatched
    channel pattern; unauthenticated requests get 401. Guests can never be
    authorized — the callbacks fail closed on a null user.
  operationId: broadcastingAuth
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - socket_id
            - channel_name
          properties:
            socket_id:
              type: string
              example: "1234.5678"
              description: Echo's socket id for this connection (sent by pusher-js, omitted from the old schema).
            channel_name:
              type: string
              example: "private-App.Models.User.1"
            server_data:
              type: string
              description: Base64-encoded JSON from Reverb server.
  responses:
    "200":
      description: Channel authorized successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              socket:
                type: string
              channel:
                type: string
    "401":
      description: Unauthenticated (no Bearer token or session).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "403":
      description: Authenticated but not authorized for this channel (someone else's channel, or an unmatched pattern).
