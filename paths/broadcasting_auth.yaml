post:
  tags:
    - WebSocket
  summary: Authorize private channel subscription
  description: >
    **STATUS (verified live): routed but not yet functional.** This path is
    registered (`Broadcast::routes()` on the `web` group) and reachable, but
    it answers **403 for every private-channel request** — an owner's own
    subscription, a valid Bearer token included — because the route carries
    no auth middleware, so no user is ever resolved and
    `PusherBroadcaster::auth()` rejects before the channel callbacks run.
    Private-channel subscriptions (push/DM delivery) are therefore blocked
    until the route is moved onto the `api` group with `auth:sanctum`; merely
    calling `withBroadcasting()` changes nothing, since that only re-registers
    the same `web`-group route. Do not build a client against the current
    behaviour — Bearer tokens cannot work here today.

    Intended contract (once fixed): called automatically by Laravel Echo when
    the client attempts to subscribe to a private channel. The request sends
    `socket_id` + `channel_name` (`application/x-www-form-urlencoded`); the
    server authenticates the requester and returns the channel authorization.
    Only two private channels exist: `private-App.Models.User.{id}` (your own
    notifications and video-processing events) and `private-map.{mapId}`
    (owner-only live map drafts). Subscribing to anyone else's channel 403s,
    as does any unmatched channel pattern.
  operationId: broadcastingAuth
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - socket_id
            - channel_name
          properties:
            socket_id:
              type: string
              example: "1234.5678"
              description: Echo's socket id for this connection (sent by pusher-js, omitted from the old schema).
            channel_name:
              type: string
              example: "private-App.Models.User.1"
            server_data:
              type: string
              description: Base64-encoded JSON from Reverb server.
  responses:
    "200":
      description: Channel authorized successfully (the intended behaviour once the route is fixed).
      content:
        application/json:
          schema:
            type: object
            properties:
              socket:
                type: string
              channel:
                type: string
    "403":
      description: >
        User not authorized for this channel — **or any channel today.**
        Until the auth fix lands, this is returned for every private-channel
        request, including valid ones.
