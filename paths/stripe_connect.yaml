delete:
  tags:
    - Stripe
  summary: Disconnect Stripe account
  description: Disconnect the Stripe Connect account
  responses:
    '200':
      description: Account disconnected successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
    '400':
      description: No Stripe Connect account found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
