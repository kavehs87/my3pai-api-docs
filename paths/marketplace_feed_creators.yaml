get:
  tags:
    - Public
    - Marketplace
  summary: Creator-grouped feed (PWA swipe pager)
  description: >
    Creator-grouped feed for the PWA swipe pager: cursor-paginated creators,
    each entry carrying the creator card, a featured flag, the spotlight
    video (the creator's READY profile intro video, or null), and the creator's top-N
    marketplace items across all six types (popularity-ranked, same item
    shape and visibility rules as `/marketplace/items`).

    Fixed order: featured-first, then popular (sellable-item count). Same
    `q`/`region` filters as `/items` (applied to both creator selection and
    per-creator items); `type` scopes the per-creator items only. No
    personalization (following-first, trending, seen-state are phase 2).
    CDN-cacheable like `/feed`.
  security: []
  parameters:
    - name: type
      in: query
      style: form
      explode: true
      description: Scopes per-creator items only (creators still eligible via any enabled type)
      schema:
        type: array
        items:
          type: string
          enum:
            - maps
            - masterclasses
            - consultations
            - media
            - blog
            - podcasts
    - name: q
      in: query
      schema:
        type: string
        maxLength: 200
    - name: region
      in: query
      schema:
        type: string
        maxLength: 100
    - name: location
      in: query
      description: Alias for region
      schema:
        type: string
        maxLength: 100
    - name: cursor
      in: query
      schema:
        type: string
        maxLength: 2000
    - name: limit
      in: query
      description: Creators per page
      schema:
        type: integer
        minimum: 1
        maximum: 48
        default: 24
    - name: items_limit
      in: query
      description: Top-N items per creator (pager rail budget)
      schema:
        type: integer
        minimum: 1
        maximum: 12
        default: 6
  responses:
    '200':
      description: Paginated creator-grouped feed
      headers:
        Cache-Control:
          schema:
            type: string
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: ../components/schemas/MarketplaceFeedCreator.yaml
              meta:
                type: object
                properties:
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
                  total:
                    type: integer
                    description: Total matching creators (before pagination)
                  limit:
                    type: integer
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
