delete:
  tags:
    - Feedback
  summary: Hard-delete feedback content (admin)
  description: Removes the content row and its reports. The author is notified when visible content is removed.
  operationId: adminFeedbackDestroy
  parameters:
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [comment, rating, testimonial]
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Deleted
    '401':
      description: Unauthenticated
    '403':
      description: Not an admin
    '404':
      description: Content not found
