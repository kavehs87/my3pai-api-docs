get:
  tags:
    - POIs
    - DZT
  summary: List DZT items attached to a POI
  description: |
    Get all DZT Knowledge Graph entities attached to a POI.
    Requires authentication and ownership of the POI.
  parameters:
    - name: poi
      in: path
      required: true
      schema:
        type: integer
      description: The POI ID
  responses:
    '200':
      description: List of attached DZT items
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  dztItems:
                    type: array
                    items:
                      $ref: ../components/schemas/PoiDztItemResource.yaml
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: POI not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
post:
  tags:
    - POIs
    - DZT
  summary: Attach a DZT item to a POI
  description: |
    Attach a tourism entity from the DZT Knowledge Graph (Open Data Germany) to a POI.
    Requires authentication and ownership of the POI.

    The item metadata (including rights, attribution, and source URLs) is stored
    in the database. This data is frozen in snapshots for purchased map immutability.
  parameters:
    - name: poi
      in: path
      required: true
      schema:
        type: integer
      description: The POI ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AttachDztItemRequest.yaml
  responses:
    '201':
      description: DZT item attached successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  dztItem:
                    $ref: ../components/schemas/PoiDztItemResource.yaml
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: POI not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '422':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
