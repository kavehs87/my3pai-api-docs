patch:
  tags:
    - Influencers
    - Consultations
  summary: Complete booking
  description: Mark consultation as completed
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Booking marked as completed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: ../components/schemas/ConsultationBooking.yaml
              message:
                type: string
    '400':
      description: Booking must be confirmed before completion
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Booking not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
