get:
  tags:
    - Billing
  summary: Get invoice summary
  description: Get invoice summary statistics for the current user
  security:
    - BearerAuth: []
  parameters:
    - name: from_date
      in: query
      schema:
        type: string
        format: date
    - name: to_date
      in: query
      schema:
        type: string
        format: date
  responses:
    '200':
      description: Invoice summary retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  paid:
                    type: object
                    properties:
                      count:
                        type: integer
                      total_cents:
                        type: integer
                        description: Sum of invoice totals (customer perspective) in cents
                      total_formatted:
                        type: string
                        example: "1234.56"
                  received:
                    type: object
                    properties:
                      count:
                        type: integer
                      total_cents:
                        type: integer
                        description: Sum of influencer payouts (creator perspective) in cents
                      total_formatted:
                        type: string
                        example: "1234.56"
                  status_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        count:
                          type: integer
                        total_cents:
                          type: integer
                        total_formatted:
                          type: string
    '401':
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
