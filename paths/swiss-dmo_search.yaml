get:
  tags:
    - Swiss DMO
  summary: Search Swiss DMO resources
  description: |
    Search across all Swiss DMO resource types (destinations, attractions, tours)
    by name, abstract, or description. Returns DZT-compatible results with
    coordinates, license info, and source identifier.
  parameters:
    - name: q
      in: query
      required: true
      schema:
        type: string
        maxLength: 200
      description: Search query (matched against name, abstract, description)
    - name: entityType
      in: query
      schema:
        type: string
        enum: [destination, attraction, tour]
      description: Filter by resource type. Omit to search all types.
    - name: locality
      in: query
      schema:
        type: string
        maxLength: 100
      description: Filter by locality (future use)
    - name: region
      in: query
      schema:
        type: string
        maxLength: 100
      description: Filter by region (future use)
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: Search results
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: ../components/schemas/SwissDmoSearchResult.yaml
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
