post:
  tags:
    - AI
  summary: Complete POI basic fields
  description: Fills missing `title, placeType, activities, description...` via `poi.completeBasic` (`reasoning none`, `temp 0.1`, `max 4096`).
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [poi]
          properties:
            poi: { type: object, description: Existing POI snapshot }
  responses:
    '200':
      description: Updates generated
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                properties:
                  updates: { type: object, description: Partial POI fields }
                  quota: { type: object, nullable: true }
    '401': { description: Unauthorized, content: { application/json: { schema: { $ref: ../components/schemas/ErrorResponse.yaml } } } }
    '422': { description: Validation failed, content: { application/json: { schema: { $ref: ../components/schemas/ValidationError.yaml } } } }
    '429': { description: Quota exceeded, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, error: { type: string }, code: { type: string, example: QUOTA_EXCEEDED } } } } } }
    '500': { description: OpenRouter error, content: { application/json: { schema: { $ref: ../components/schemas/ErrorResponse.yaml } } } }
