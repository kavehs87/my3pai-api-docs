post:
  tags:
    - Feedback
  summary: Hide feedback content (admin)
  description: Kind is comment|rating|testimonial. Counters adjust; the author is notified with a generic reason.
  operationId: adminFeedbackHide
  parameters:
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [comment, rating, testimonial]
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Hidden
    '401':
      description: Unauthenticated
    '403':
      description: Not an admin
    '404':
      description: Content not found
