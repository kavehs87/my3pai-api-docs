put:
  tags:
    - Maps
    - POIs
  summary: Update draft POI in map (legacy full merge)
  description: >
    Update a draft POI with minimal validation. Allows auto-saving incomplete data
    without hitting 422 validation errors. All fields are optional (nullable).
    
    The POI's status will be set to (or remain) `'draft'` after update.
    Since 2026-08 this endpoint preserves absent relations (fix for scalar-vs-relation wipe
    `api/app/Services/PoiService.php:642` — only touched paths are synced, absent = leave).
    Scalar merge is still by path presence; relations use `preserve_absent_relations=true` and
    single-transaction version bump. Broadcasts `poi.draft.patched` on `private map.{mapId}` via Reverb (`toOthers`).

    Prefer `PATCH` with delta `{baseVersion, patch:[{path,value}]}` for snappy autosave (smaller payload,
    Reverb fanout to other tabs, <100ms cross-tab sync). `PUT` is kept for backward compat.

    **Optimistic Locking:**
    This endpoint uses optimistic locking to prevent concurrent edit conflicts. The `draft_version`
    field is required and must match the current database version exactly (server-owned, set to 0 on create).
    
    - **Version Matching:** Client must send the exact current `draftVersion` from the last response
    - **On Success:** Server increments the version atomically and returns the new version in response
    - **On Conflict (409):** If versions don't match, returns current POI state with current `draftVersion`
    - **Version Flow:** 
      1. Read POI → Get `draftVersion: 0`
      2. Update with `draft_version: 0` → Success, response `draftVersion: 1`
      3. Update with `draft_version: 1` → Success, response `draftVersion: 2`
      4. If another client updated → `draft_version: 1` fails with 409, response shows `draftVersion: 2`
    
    **Field Deletion Behavior:**
    - Sending `null` for a nullable field will **clear** that field (set to NULL in database)
    - Sending `""` (empty string) for a nullable field will also **clear** that field (normalized to null)
    - Not including a field in the request will **not update** that field (partial update — now for relations too)
    - The response will return `null` for cleared fields
    
    **Use Case:** Frontend auto-save (legacy). New code should use `PATCH` delta.
  parameters:
    - name: map
      in: path
      required: true
      schema:
        type: integer
      description: The map ID
    - name: poi
      in: path
      required: true
      schema:
        type: integer
      description: The POI ID
  requestBody:
    required: false
    description: >
      Partial POI data. All fields are optional. Only provided fields will be updated.
      
      **Field Update Rules:**
      - Fields included with values → Updated with new value
      - Fields included with `null` → Cleared (set to NULL)
      - Fields included with `""` (empty string) → Cleared (normalized to NULL)
      - Fields not included → Not updated (remains unchanged)
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdatePoiDraftRequest.yaml
        examples:
          minimal:
            summary: Minimal update (first update after creation)
            description: >
              After creating a POI with draft_version: 0, the response contains draftVersion: 0.
              For the first update, send draft_version: 0. The response will contain draftVersion: 1.
            value:
              draft_version: 0
              basic:
                name: "Updated Name"
          subsequent:
            summary: Subsequent update
            description: >
              After the first update, the response contained draftVersion: 1.
              For the next update, send draft_version: 1. The response will contain draftVersion: 2.
            value:
              draft_version: 1
              basic:
                tagline: "Updated tagline"
              category:
                placeType: "culture"
          clearFields:
            summary: Clear fields (field deletion)
            description: >
              Example showing how to clear fields by sending null or empty string.
              Both null and empty string will clear the field.
              Note: draft_version must still match the current POI version.
            value:
              draft_version: 2
              basic:
                summary: null
                tagline: ""
                phone: null
                website: null
                myScore: null
                googleRating: null
  responses:
    '200':
      description: Draft POI updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  poi:
                    $ref: ../components/schemas/PoiResource.yaml
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: POI or map not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '409':
      description: >
        Version conflict - the POI has been modified by another session.
        
        The `draft_version` in the request does not match the current database version.
        This can happen when:
        - Another client/tab updated the POI between your read and write
        - The version you sent is stale (lower or higher than current)
        
        The response includes the current POI state with the current `draftVersion`.
        You should refresh your local state and retry the update with the new version.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Version conflict - the POI has been modified by another session"
              data:
                type: object
                properties:
                  poi:
                    $ref: ../components/schemas/PoiResource.yaml
    '422':
      description: Validation failed (invalid enum values, type mismatches, etc.)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
patch:
  tags:
    - Maps
    - POIs
  summary: Patch draft POI via delta (Reverb live sync)
  description: >
    Delta patch for a draft POI. Send only touched leafs as `patch:[{path,value}]` with `baseVersion`
    (optimistic lock). Server does `WHERE draft_version = baseVersion` atomically, bumps to `+1` inside
    a single transaction (scalar + touched relations together, no split race `api/app/Services/PoiService.php:662`),
    and broadcasts `poi.draft.patched` on `private map.{mapId}` to other tabs (`api/app/Events/PoiDraftPatched.php:10`)
    via Reverb. Absent paths are left untouched (fix for wipe). `value: null` clears scalar, `[]` clears relation.

    Use with `X-Socket-ID: Echo.socketId()` so `toOthers()` suppresses own echo. On 409 refresh from `data.poi.draftVersion`.
    Throttled `120/min` (`api/routes/api.php:352`). Prefer this over `PUT` for autosave (10-50× smaller payload, <100ms cross-tab sync).
  parameters:
    - name: map
      in: path
      required: true
      schema:
        type: integer
      description: The map ID
    - name: poi
      in: path
      required: true
      schema:
        type: integer
      description: The POI ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PatchPoiDraftRequest.yaml
        examples:
          rename:
            summary: Rename (scalar-only, relations preserved)
            value:
              baseVersion: 5
              patch:
                - path: basic.name
                  value: "Renamed Lake"
          relation:
            summary: Replace activities, clear tags
            value:
              baseVersion: 5
              patch:
                - path: category.activities
                  value: ["hiking_area"]
                - path: regions.tags
                  value: []
          clear:
            summary: Clear scalar
            value:
              baseVersion: 6
              patch:
                - path: basic.phone
                  value: null
  responses:
    '200':
      description: Draft POI patched successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  poi:
                    $ref: ../components/schemas/PoiResource.yaml
    '403':
      description: Forbidden - not owner
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: POI or map not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '409':
      description: >
        Version conflict — `baseVersion` != current `draft_version`.
        Response `data.poi` is current state; rebase and retry.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Version conflict - the POI has been modified by another session"
              data:
                type: object
                properties:
                  poi:
                    $ref: ../components/schemas/PoiResource.yaml
    '422':
      description: Validation failed (patch.path unknown or baseVersion missing)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml

