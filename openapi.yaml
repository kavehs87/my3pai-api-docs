openapi: 3.0.3
info:
  title: My3PAI API
  version: 1.0.0
  description: >
    API for My3PAI - A platform for creating and sharing travel maps and points
    of interest (POIs).


    ## Authentication

    The API uses Laravel Sanctum for token-based authentication. Include the
    token in the Authorization header:

    ```

    Authorization: Bearer <token>

    ```


    ## Guest Cart Support

    Shopping cart endpoints support both authenticated users and guest visitors:

    - **Authenticated users**: Include `Authorization: Bearer <token>` header

    - **Guest users**: Include `X-Session-ID: <session-id>` header (or omit both
    headers to auto-generate a session)

    - Guest carts expire after 7 days, user carts expire after 30 days

    - Guest carts can be merged into user carts upon login using `/cart/merge`
    endpoint


    ## Rate Limiting

    - Authentication endpoints: 5 requests per minute per IP

    - Public map endpoint: 60 requests per minute per IP

    - Unified Places autocomplete/detail: 300 requests per minute per IP

    - Unified Places nearby/map: 120 requests per minute per IP

    - Unified Places categories: 60 requests per minute per IP

    - Rate limit exceeded returns HTTP 429


    ## Base URL

    - Local development: `http://localhost:8000/api`

    - All routes are relative to `/api` unless explicitly noted
  contact:
    name: My3PAI API Support
  license:
    name: Proprietary
    url: https://my3pai.com
servers:
  - url: http://localhost:8000/api
    description: Local development server
  - url: https://api.my3pai.com/api
    description: Production server
tags:
  - name: Authentication
    description: User registration, login, and authentication
  - name: Profile
    description: User profile management
  - name: Influencers
    description: Influencer profile management and public profiles
  - name: Blog
    description: Blog posts management and public blog content
  - name: Podcast
    description: Podcast episodes management and public podcast content
  - name: Masterclasses
    description: Training courses and masterclasses management
  - name: Consultations
    description: 1-on-1 consultation booking system
  - name: Media Assets
    description: Digital assets marketplace (stock footage, presets, templates, etc.)
  - name: Stripe
    description: Stripe Connect integration for payment processing
  - name: Maps
    description: Map creation and management
  - name: POIs
    description: Points of Interest management
  - name: Media
    description: Media upload and management for POIs and maps
  - name: Admin
    description: Administrative endpoints (admin only)
  - name: AI
    description: AI-powered endpoints using OpenRouter
  - name: Public
    description: Public endpoints that don't require authentication
  - name: Billing
    description: Shopping cart, orders, payments, and invoicing
  - name: Unified Places
    description: >
      Unified Place Service bridge — aggregates places from multiple sources
      (OpenStreetMap, Rexby, Swiss DMO, etc.) into a normalized API.
      Replaces Google Places Autocomplete, NearbySearch, and FetchFields.
  - name: Webhooks
    description: Webhook endpoints for external service callbacks
  - name: Notifications
    description: In-app notification management (bell notifications)
  - name: WebSocket
    description: >
      Real-time WebSocket connections via Laravel Reverb. Clients connect using
      `laravel-echo` + `pusher-js`. Events are broadcast on private channels
      `App.Models.User.{id}` (notifications, video processing) and `map.{mapId}`
      (live map drafts, owner-only). Connect with `REVERB_APP_KEY`, `REVERB_APP_ID`, and
      `REVERB_APP_SECRET` from `.env`. Authentication is handled via `POST /broadcasting/auth`.

      **Broadcast events:**

      - `Illuminate\Notifications\Events\BroadcastNotificationCreated` — in-app notifications
      - `App\Events\NewContactMessage` — new contact message for an influencer
      - `App\Events\IntroVideoProcessingCompleted` — intro video processing result
      - `App\Events\PoiMediaProcessingCompleted` — POI media processing result
      - `App\Events\PoiDraftCreated` (`poi.draft.created` on `private map.{mapId}`) — draft POI created
      - `App\Events\PoiDraftPatched` (`poi.draft.patched` on `private map.{mapId}`) — draft POI patched `{map_id, poi_id, base_version, new_version, patch:[{path,value}], poi, actor_id}`
      - `App\Events\PoiDraftDeleted` (`poi.draft.deleted` on `private map.{mapId}`) — draft POI deleted
      - `App\Events\MapDraftPatched` (`map.draft.patched` on `private map.{mapId}`) — map patched
