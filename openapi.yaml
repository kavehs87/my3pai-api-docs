  - name: Consultations
    description: 1-on-1 consultation booking system
  - name: Media Assets
    description: Digital assets marketplace (stock footage, presets, templates, etc.)
  - name: Stripe
    description: Stripe Connect integration for payment processing
  - name: Maps
    description: Map creation and management
  - name: POIs
    description: Points of Interest management
  - name: Media
    description: Media upload and management for POIs and maps
  - name: Admin
    description: Administrative endpoints (admin only)
  - name: AI
    description: AI-powered endpoints using Google Vertex AI
  - name: Public
    description: Public endpoints that don't require authentication
  - name: Billing
    description: Shopping cart, orders, payments, and invoicing
  - name: Webhooks
    description: Webhook endpoints for external service callbacks
